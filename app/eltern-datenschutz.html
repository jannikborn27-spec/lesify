<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datenschutz &amp; Konto · Eltern-Bereich · Lesify</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>(function(){try{if(localStorage.getItem("lesify:darkmode")==="1")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
</head>
<body data-page="eltern-daten">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="main-inner" id="eltern-main"></main>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth-gate.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var R = LesifyUI.Render, I = LesifyUI.Icons, main = document.getElementById('eltern-main');

  function modal(title, sub, bodyHtml, onConfirm, confirmLabel, danger) {
    var scrim = document.createElement('div');
    scrim.className = 'modal-scrim';
    scrim.innerHTML =
      '<div class="modal" style="max-width:420px">' +
        '<div class="modal-head"><div>' +
          '<h3 class="modal-title">' + title + '</h3>' +
          (sub ? '<p class="modal-sub">' + sub + '</p>' : '') +
        '</div><button class="modal-close" type="button" aria-label="Schließen">' + I.x + '</button></div>' +
        '<div class="modal-body">' + bodyHtml + '</div>' +
        '<div class="modal-foot">' +
          '<button class="btn btn-ghost" type="button" data-x>Abbrechen</button>' +
          '<button class="btn btn-primary" type="button" data-ok' + (danger ? ' style="background:var(--rot);border-color:var(--rot)"' : '') + '>' + (confirmLabel || 'Speichern') + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(scrim);
    requestAnimationFrame(function () { scrim.classList.add('is-open'); });
    function close() { scrim.classList.remove('is-open'); setTimeout(function () { scrim.remove(); }, 200); }
    scrim.addEventListener('click', function (e) { if (e.target === scrim) close(); });
    scrim.querySelector('.modal-close').addEventListener('click', close);
    scrim.querySelector('[data-x]').addEventListener('click', close);
    scrim.querySelector('[data-ok]').addEventListener('click', function () {
      var ergebnis = onConfirm(scrim);
      if (ergebnis && typeof ergebnis.then === 'function') ergebnis.then(function (r) { if (r !== false) close(); });
      else if (ergebnis !== false) close();
    });
    return scrim;
  }

  async function render() {
    var user = await Lesify.getUser();
    main.innerHTML =
      '<div class="page-head"><div>' +
        '<div class="page-eyebrow">Eltern-Bereich</div>' +
        '<h1 class="page-title">Datenschutz &amp; Konto</h1>' +
        '<p class="page-sub">Das Familienkonto umfasst alle Kind-Profile. Export und Löschung wirken auf das gesamte Konto.</p>' +
      '</div></div>' +
      '<div class="card eltern-card">' +
        '<h3>Konto-Angaben</h3>' +
        '<div class="abo-row"><span class="lbl">Einwilligung erteilt am</span><span class="val">' +
          (user.einwilligungAm ? R.formatDatum(user.einwilligungAm) : '—') + '</span></div>' +
        '<div class="abo-row"><span class="lbl">Konto-E-Mail</span><span class="val">' + (user.email || '—') + '</span></div>' +
        '<div class="abo-row"><span class="lbl">Aufbewahrung</span><span class="val">Bis zur Löschung des Kontos</span></div>' +
        '<div class="kc-actions" style="margin-top:18px">' +
          '<button class="btn btn-sm btn-ghost" data-ds="export">Daten exportieren</button>' +
          '<button class="btn btn-sm btn-ghost" data-ds="loeschen" style="color:var(--rot)">Familienkonto löschen</button>' +
        '</div>' +
        '<p class="kc-hint">Eine Löschung entfernt alle Fächer, Chats, Lernzettel, Dateien und Klausuren aller Kinder unwiderruflich.</p>' +
      '</div>' +
      '<div class="card eltern-card eltern-trust">' +
        '<span class="spark">' + I.lock + '</span>' +
        '<div><h3>Was wir nie sehen oder teilen</h3>' +
        '<p>Chat-Wortlaut und Lernzettel-Inhalte verlassen nie das Konto deines Kindes — auch nicht an dich als Elternteil. ' +
          'Wir werten sie ausschließlich zu den Wochenzahlen aus, die du auf den Kind-Seiten siehst.</p></div>' +
      '</div>';
    wire();
  }

  function wire() {
    LesifyUI.qsa('[data-ds]').forEach(function (b) {
      b.addEventListener('click', async function () {
        var a = b.getAttribute('data-ds');
        if (a === 'export') {
          // GET /user/export braucht den Authorization-Header (kein
          // `?token=`-Fallback) — per fetch + Blob statt `<a href>`, wie beim
          // Lernzettel-/Testklausur-Download.
          try {
            var res = await fetch(Lesify._base + '/user/export', {
              headers: { Authorization: 'Bearer ' + Lesify._getToken() }
            });
            if (!res.ok) throw new Error('export_fehlgeschlagen');
            var text = await res.text();
            var blob = new Blob([text], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var link = document.createElement('a');
            link.href = url;
            link.download = 'lesify-datenexport.json';
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
            LesifyUI.toast('Export wird heruntergeladen.');
          } catch (err) {
            LesifyUI.toast('Export fehlgeschlagen — bitte erneut versuchen.');
          }
        } else if (a === 'loeschen') {
          modal('Familienkonto löschen?', 'Unwiderruflich. Alle Kind-Profile und deren Inhalte werden gelöscht, das Abo endet sofort.',
            '<div class="field mt-0"><label for="m-pass">Zum Bestätigen dein Passwort eingeben</label><input class="input" id="m-pass" type="password" autocomplete="current-password"></div>',
            async function (scrim) {
              var passwort = scrim.querySelector('#m-pass').value;
              if (!passwort) { scrim.querySelector('#m-pass').focus(); return false; }
              try {
                await Lesify.loeschenKonto(passwort);
                LesifyUI.toast('Konto gelöscht.');
                Lesify._setToken('');
                window.location.href = '/';
              } catch (err) {
                LesifyUI.toast(Lesify.fehlerText(err));
                return false;
              }
            }, 'Endgültig löschen', true);
        }
      });
    });
  }

  await render();
});
</script>
</body>
</html>
