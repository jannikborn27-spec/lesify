<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suchen · Lesify</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="suchen">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="main-inner">

      <div class="page-head">
        <div>
          <div class="page-eyebrow">Suchen</div>
          <h1 class="page-title">Alles an einem Ort finden</h1>
          <p class="page-sub">Fächer, Themen, Chats, Lernzettel, Dateien, Klausuren und Testklausuren durchsuchen.</p>
        </div>
      </div>

      <div class="search-input-wrap" style="max-width:560px;margin-bottom:var(--sp-10)">
        <span id="search-icon" class="search-field-ico"></span>
        <input type="text" class="search-input" id="search-input" placeholder="z. B. Bruchrechnung, Gedichtanalyse, Essay…" autofocus>
      </div>

      <div id="search-results"></div>

    </main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var I = LesifyUI.Icons;
  document.getElementById('search-icon').innerHTML = I.search;

  var params = new URLSearchParams(window.location.search);
  var input = document.getElementById('search-input');
  input.value = params.get('q') || '';

  function render() {
    var q = input.value.trim();
    var results = document.getElementById('search-results');
    if (!q) {
      results.innerHTML = '<div class="empty-state"><div class="es-icon">' + I.search + '</div><h4>Womit soll ich dir helfen zu finden?</h4><p>Tipp einfach los — die Ergebnisse erscheinen live.</p></div>';
      return;
    }
    var groups = LesifyUI.search(q);
    if (!groups.length) {
      results.innerHTML = '<div class="empty-state"><div class="es-icon">' + I.search + '</div><h4>Keine Ergebnisse für „' + q + '"</h4><p>Versuch einen anderen Begriff oder prüfe die Schreibweise.</p></div>';
      return;
    }
    results.innerHTML = LesifyUI.searchResultsHtml(groups);
  }

  input.addEventListener('input', render);
  render();
  LesifyUI.mountSearchDev(render);
});
</script>
</body>
</html>
