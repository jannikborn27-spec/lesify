<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Übersicht · Eltern-Bereich · Lesify</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>(function(){try{var d=JSON.parse(localStorage.getItem("lesify_db_v2")||"null");if(d&&d.settingsOverride&&d.settingsOverride.darkMode)document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
</head>
<body data-page="eltern">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="main-inner" id="eltern-main"></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var R = LesifyUI.Render, I = LesifyUI.Icons, main = document.getElementById('eltern-main');

  /* ---- Gate: nur Elternkonto mit Familien-Abo ---- */
  if (!Lesify.istElternteil()) {
    main.innerHTML =
      '<div class="card eltern-card eltern-gate">' +
        '<span class="spark" style="width:26px;height:26px;color:var(--ink-400);display:inline-block">' + I.lock + '</span>' +
        '<h1>Eltern-Bereich</h1>' +
        '<p>Dieser Bereich ist Elternkonten mit einem Familien-Abo vorbehalten. ' +
          'Ein Solo-Elternkonto lernt selbst und nutzt die normale Schüler-Ansicht.</p>' +
        '<div style="display:flex;gap:10px;justify-content:center">' +
          '<a class="btn btn-ghost" href="dashboard.html">Zur App</a>' +
          '<button class="btn btn-primary" id="dev-eltern">Als Elternteil-Ansicht testen</button>' +
        '</div>' +
        '<p style="margin:16px 0 0;font-size:0.75rem;color:var(--ink-400)">Prototyp-Schalter — im Live-Betrieb ergibt sich die Rolle aus dem Konto.</p>' +
      '</div>';
    document.getElementById('dev-eltern').addEventListener('click', function () {
      Lesify.setRolle('elternteil');
      location.reload();
    });
    return;
  }

  function aktivChip(kind) {
    var a = kind.aktivitaetAmpel;
    return '<span class="ampel-chip ampel-chip-' + a + '"><span class="ampel-dot ampel-' + a + '"></span>' +
      Lesify.kindAktivitaetLabel(a) + '</span>';
  }

  function miniKarte(kind) {
    var col = Lesify.getFachColor(kind.farbe);
    var sub = kind.klasse + (kind.eingeladen
      ? (kind.letzteAktivitaet ? ' · zuletzt aktiv ' + kind.letzteAktivitaet : ' · noch nicht gestartet')
      : ' · Einladung ausstehend');
    return '<a class="card eltern-mini-card" href="eltern-kind.html?id=' + kind.id + '">' +
      '<span class="fach-avatar" style="width:38px;height:38px;flex-shrink:0;background:' + col.base + '"><span>' +
        kind.name.charAt(0).toUpperCase() + '</span></span>' +
      '<span class="kc-meta">' +
        '<span class="kc-name">' + kind.name + '</span>' +
        '<span class="kc-sub">' + sub + '</span>' +
        (kind.eingeladen ? '<span style="display:inline-block;margin-top:6px">' + aktivChip(kind) + '</span>' : '') +
      '</span>' +
    '</a>';
  }

  /* ---- Familien-weite Kennzahlen — Summe über alle Kinder, aus denselben
     Wochen-Daten wie die Einzelkarten, nur zusammengezählt. ---- */
  function familienStats(kinder) {
    var aktiveKinder = 0, nachrichten = 0, klausuren = 0;
    kinder.forEach(function (k) {
      var z = Lesify.kindZusammenfassung(k.id);
      if (k.aktivitaetAmpel !== 'rot') aktiveKinder++;
      nachrichten += z.nachrichtenDieWoche;
      klausuren += z.anstehendeKlausuren;
    });
    function stat(num, label) { return '<div class="eltern-stat"><div class="eltern-stat-num">' + num + '</div><div class="eltern-stat-label">' + label + '</div></div>'; }
    return '<div class="eltern-stats">' +
      stat(kinder.length, kinder.length === 1 ? 'Kind' : 'Kinder') +
      stat(aktiveKinder, 'diese Woche aktiv') +
      stat(nachrichten, 'KI-Nachrichten diese Woche') +
      stat(klausuren, 'anstehende Klausuren') +
    '</div>';
  }

  function render() {
    var fam = Lesify.familie();
    var kinder = Lesify.kinder();
    main.innerHTML =
      '<div class="page-head"><div>' +
        '<div class="page-eyebrow">Eltern-Bereich</div>' +
        '<h1 class="page-title">Hallo, ' + fam.elternName.split(' ')[0] + '</h1>' +
        '<p class="page-sub">Überblick über deine Kinder — ob sie dranbleiben, ohne ihnen über die Schulter zu schauen.</p>' +
      '</div></div>' +

      familienStats(kinder) +

      '<div class="card eltern-card eltern-trust">' +
        '<span class="spark">' + I.lock + '</span>' +
        '<div><h3>Warum siehst du keine Chats oder Lernzettel?</h3>' +
        '<p>Lesify zeigt dir, <strong>ob</strong> dein Kind dranbleibt — nicht <strong>was</strong> es schreibt. ' +
          'Chat-Verläufe, Lernzettel-Inhalte und einzelne Testklausur-Ergebnisse bleiben bewusst privat, ' +
          'damit dein Kind offen fragen kann. Du bekommst nur zusammengefasste Wochenzahlen.</p></div>' +
      '</div>' +

      '<div class="page-head" style="margin:8px 0 14px"><div>' +
        '<h2 class="page-title" style="font-size:1.15rem">Deine Kinder</h2>' +
      '</div><a class="btn btn-ghost btn-sm" href="eltern-kinder.html">Verwalten' + I.arrowRight + '</a></div>' +
      '<div class="eltern-mini-row">' + kinder.map(miniKarte).join('') + '</div>' +

      '<div class="page-head" style="margin:28px 0 14px"><div>' +
        '<h2 class="page-title" style="font-size:1.15rem">Konto</h2>' +
      '</div></div>' +
      '<div class="eltern-mini-row">' +
        '<a class="card eltern-mini-card" href="eltern-abo.html">' +
          '<span class="spark" style="width:22px;height:22px;color:var(--ink-400)">' + I.docCheck + '</span>' +
          '<span class="kc-meta"><span class="kc-name">Abo &amp; Sitze</span><span class="kc-sub">Tarif, Abrechnung, Familien-Plätze</span></span>' +
        '</a>' +
        '<a class="card eltern-mini-card" href="eltern-datenschutz.html">' +
          '<span class="spark" style="width:22px;height:22px;color:var(--ink-400)">' + I.lock + '</span>' +
          '<span class="kc-meta"><span class="kc-name">Datenschutz &amp; Konto</span><span class="kc-sub">Export, Löschung, Einwilligung</span></span>' +
        '</a>' +
      '</div>';
  }

  render();
});
</script>
</body>
</html>
