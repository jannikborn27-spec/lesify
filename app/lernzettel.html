<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernzettel · Lesify</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .lz-msg { display: flex; gap: 10px; max-width: 90%; animation: fade-up 280ms var(--ease-out); }
  .lz-msg.from-user { align-self: flex-end; flex-direction: row-reverse; }
  .lz-avatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .lz-msg.from-ai .lz-avatar { background: var(--ink-950); color: #fff; padding: 6px; }
  .lz-msg.from-user .lz-avatar { background: var(--ink-200); color: var(--ink-700); font-size: 0.64rem; font-weight: 700; }
  .lz-bubble { padding: 10px 13px; border-radius: 13px; font-size: 0.84rem; line-height: 1.5; }
  .lz-msg.from-ai .lz-bubble { background: var(--paper); border: 1px solid var(--line); border-top-left-radius: 4px; }
  .lz-msg.from-user .lz-bubble { background: var(--ink-950); color: #fff; border-top-right-radius: 4px; }
  .lz-composer { display: flex; gap: 8px; align-items: flex-end; }
  .lz-composer textarea { flex: 1; border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: 10px 12px; font-family: inherit; font-size: 0.85rem; resize: none; max-height: 100px; }
  .lz-composer textarea:focus { outline: none; border-color: var(--ink-900); }
  .free-counter { font-size: 0.72rem; color: var(--ink-500); }
  .free-counter strong { color: var(--ink-900); }
</style>
</head>
<body data-page="themen">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="main-inner" style="padding-bottom:60px">

      <div id="lz-crumb" class="page-eyebrow" style="margin-bottom:16px"></div>
      <div class="page-head" id="lz-head" style="margin-bottom:var(--sp-6)"></div>

      <div class="split-view">
        <div class="split-doc" id="lz-doc"></div>
        <div class="split-chat">
          <div class="split-chat-head">
            <div class="flex justify-between items-center">
              <span class="text-sm fw-600">Gemeinsam überarbeiten</span>
              <span class="free-counter" id="lz-free-counter"></span>
            </div>
          </div>
          <div class="split-chat-thread" id="lz-thread"></div>
          <div class="split-chat-composer">
            <div class="lz-composer">
              <textarea id="lz-input" rows="1" placeholder="Was soll angepasst werden?"></textarea>
              <button class="btn btn-primary btn-sm" id="lz-send" style="width:38px;height:38px;padding:0;border-radius:10px" aria-label="Senden"></button>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var I = LesifyUI.Icons, R = LesifyUI.Render;
  var params = new URLSearchParams(window.location.search);
  var lzId = params.get('id') || Lesify.lernzettel()[0].id;
  var lz = Lesify.getLernzettel(lzId) || Lesify.lernzettel()[0];
  lzId = lz.id;
  var thema = Lesify.getThema(lz.themaId);
  var fach = Lesify.getFach(lz.fachId);

  document.title = lz.titel + ' · Lesify';
  document.getElementById('lz-crumb').innerHTML =
    '<a href="thema.html?id=' + thema.id + '&tab=lernzettel" style="color:var(--ink-500)">' + thema.name + '</a>' +
    '<span style="color:var(--ink-300);margin:0 6px">/</span><span>Lernzettel</span>';

  document.getElementById('lz-head').innerHTML =
    '<div>' + R.badge(thema.id) +
      '<h1 class="page-title" style="margin-top:14px;font-size:1.6rem">' + lz.titel + '</h1>' +
      '<p class="page-sub">Zuletzt bearbeitet ' + lz.updated + '</p>' +
    '</div>' +
    '<div class="page-actions"><a href="thema.html?id=' + thema.id + '&tab=lernzettel" class="btn btn-ghost btn-sm">Zurück zum Thema</a></div>';

  function renderDoc() {
    var html = lz.content.split('\n\n').map(function (block) {
      var lines = block.split('\n');
      return lines.map(function (line) {
        if (line.indexOf('# ') === 0) return '<h1>' + line.slice(2) + '</h1>';
        if (line.indexOf('## ') === 0) return '<h2>' + line.slice(3) + '</h2>';
        if (!line.trim()) return '';
        return '<p>' + line + '</p>';
      }).join('');
    }).join('');
    document.getElementById('lz-doc').innerHTML = html;
  }

  function renderFreeCounter() {
    var el = document.getElementById('lz-free-counter');
    if (lz.freeMessagesUsed < 10) el.innerHTML = '<strong>' + (10 - lz.freeMessagesUsed) + '</strong> von 10 gratis Nachrichten übrig';
    else el.innerHTML = 'Gratis-Kontingent aufgebraucht — zählt jetzt gegen dein Nachrichten-Limit';
  }

  function renderThread() {
    var thread = document.getElementById('lz-thread');
    if (!lz.revisionMessages.length) {
      thread.innerHTML = '<div class="empty-state"><p>Sag mir, was am Lernzettel angepasst werden soll — z. B. „füg ein Beispiel zu X hinzu" oder „kürze Abschnitt Y".</p></div>';
      return;
    }
    thread.innerHTML = lz.revisionMessages.map(function (m) {
      if (m.role === 'ai') return '<div class="lz-msg from-ai"><span class="lz-avatar">' + I.spark + '</span><span class="lz-bubble">' + m.text + '</span></div>';
      return '<div class="lz-msg from-user"><span class="lz-avatar">JB</span><span class="lz-bubble">' + m.text + '</span></div>';
    }).join('');
    thread.scrollTop = thread.scrollHeight;
  }

  renderDoc(); renderFreeCounter(); renderThread();

  var input = document.getElementById('lz-input');
  input.addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(100, this.scrollHeight) + 'px'; });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  document.getElementById('lz-send').innerHTML = I.send;
  document.getElementById('lz-send').addEventListener('click', send);

  var AI_REPLIES = [
    'Erledigt — ich habe den Abschnitt entsprechend ergänzt, schau mal links.',
    'Angepasst. Ich habe ein zusätzliches Beispiel eingefügt, damit es klarer wird.',
    'Gemacht — der Punkt ist jetzt kürzer und präziser formuliert.',
    'Ich habe das ergänzt. Sag Bescheid, wenn noch etwas fehlt.'
  ];
  var replyIndex = 0;

  function send() {
    var text = input.value.trim();
    if (!text) return;
    input.value = ''; input.style.height = 'auto';
    var aiText = AI_REPLIES[replyIndex % AI_REPLIES.length];
    replyIndex++;
    var appended = '## Ergänzung\n' + text.charAt(0).toUpperCase() + text.slice(1);
    lz = Lesify.addLernzettelRevision(lzId, text, aiText, appended);
    renderDoc(); renderFreeCounter(); renderThread();
  }
});
</script>
</body>
</html>
