<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernzettel · Lesify</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>(function(){try{var d=JSON.parse(localStorage.getItem("lesify_db_v2")||"null");if(d&&d.settingsOverride&&d.settingsOverride.darkMode)document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
</head>
<body data-page="klausuren">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="main-inner" style="padding-bottom:60px">

      <div id="sp-crumb" class="page-eyebrow" style="margin-bottom:16px"></div>
      <div class="page-head" id="sp-head" style="margin-bottom:var(--sp-6)"></div>

      <div class="split-doc" id="sp-doc" style="max-width:760px"></div>

    </main>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth-gate.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var I = LesifyUI.Icons, R = LesifyUI.Render;
  var params = new URLSearchParams(window.location.search);
  var lernplanId = params.get('lernplan') || params.get('id');
  var lp = null;
  try {
    if (lernplanId) lp = await Lesify.getLernplan(lernplanId);
    else if (params.get('klausur')) lp = await Lesify.getLernplanFuerKlausur(params.get('klausur'));
  } catch (err) {
    lp = null;
  }

  if (!lp) {
    document.getElementById('sp-head').innerHTML =
      '<div><h1 class="page-title">Lernzettel nicht gefunden</h1>' +
      '<p class="page-sub">Zu diesem Lernplan gibt es keinen Lernzettel.</p></div>';
    return;
  }
  lernplanId = lp.id;

  // lp.klausur kommt bereits eingebettet (GET /lernplaene/:id) — kein
  // eigener Lesify.getKlausur()-Aufruf nötig.
  await Lesify.faecher();
  var k = lp.klausur;
  var fach = k ? Lesify.getFach(k.fachId) : null;
  if (k) {
    var fachCol = fach ? Lesify.getFachColor(fach.farbe) : null;
    LesifyUI.setPageWatermark(Lesify.getFachIcon(k.fachId) || '', fachCol ? fachCol.base : null);
    document.title = 'Lernzettel – ' + k.titel + ' · Lesify';
  }

  document.getElementById('sp-crumb').innerHTML =
    '<a href="lernplan.html?id=' + lernplanId + '" style="color:var(--ink-500)">Lernplan</a>' +
    '<span style="color:var(--ink-400);margin:0 6px">/</span><span>Lernzettel</span>';

  var updatedLine = lp.lernzettel ? ('Aktualisiert: ' + lp.lernzettel.aktualisiertAm) : 'Noch nicht gestartet';
  var actions = lp.lernzettel
    ? '<div class="page-actions"><button class="btn btn-secondary btn-sm" id="sp-download">' + I.download + ' Herunterladen</button>' +
      '<a href="lernplan.html?id=' + lernplanId + '" class="btn btn-ghost btn-sm">Zurück zum Lernplan</a></div>'
    : '<div class="page-actions"><a href="lernplan.html?id=' + lernplanId + '" class="btn btn-ghost btn-sm">Zurück zum Lernplan</a></div>';

  document.getElementById('sp-head').innerHTML =
    '<div>' + (k ? R.fachBadge(k.fachId) : '') +
      '<h1 class="page-title" style="margin-top:14px;font-size:1.6rem">Lernzettel' + (k ? ' — ' + k.titel : '') + '</h1>' +
      '<p class="page-sub">' + updatedLine + '</p>' +
    '</div>' + actions;

  document.getElementById('sp-doc').innerHTML = R.lernzettelSeite(lernplanId);

  var dl = document.getElementById('sp-download');
  if (dl) dl.addEventListener('click', async function () {
    // GET /lernplaene/:id/lernzettel/dokument braucht den Authorization-
    // Header (kein ?token=-Fallback wie bei Dateien) — darum per fetch +
    // Blob statt einer einfachen <a href>-Navigation.
    var text = await fetch(Lesify._base + '/lernplaene/' + lernplanId + '/lernzettel/dokument', {
      headers: { Authorization: 'Bearer ' + Lesify._getToken() }
    }).then(function (r) { return r.text(); });
    var blob = new Blob([text], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'lernzettel-' + Lesify.slugify(k ? k.titel : 'lernplan') + '.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
});
</script>
</body>
</html>
