<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KI Chat · Lesify</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>(function(){try{if(localStorage.getItem("lesify:darkmode")==="1")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<style>
  /* =========================================================
     KI Chat — Vollbild-Arbeitsfläche (Redesign)
     Kein .main-inner-Padding: die Seite füllt den kompletten
     Bereich rechts der App-Navigation randlos aus. Die internen
     Regionen (Verlauf-Spalte, Kopfzeile, Thread, Composer)
     scrollen jeweils selbst.
     ========================================================= */

  /* .main wird für diese Seite zur 100dvh hohen Flex-Spalte, damit
     die mobile Topbar ihre natürliche Höhe behält und der Chat den
     Rest exakt ausfüllt — statt fixem 100dvh am Chat selbst. */
  body[data-page="chat"] .main {
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
  }

  .chat-page-main {
    max-width: none; margin: 0; padding: 0;
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--bg-surface);
  }
  .chat-page-shell { flex: 1; min-height: 0; display: flex; }

  /* ---------------------------------------------------------
     Linke Spalte — Chat-Verlauf (leicht zurückgesetzte Ebene)
     --------------------------------------------------------- */
  .chat-history-sidebar {
    width: 288px; flex-shrink: 0;
    border-right: 1px solid var(--line);
    background: var(--bg-canvas);
    display: flex; flex-direction: column;
    padding: 20px 14px 14px;
  }
  .chat-history-sidebar .btn-block { flex-shrink: 0; }
  .chat-history-headline {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-400);
    padding: 0 8px; margin: 22px 0 8px;
  }
  /* ---- Verlauf-Zeilen — „Inbox"-Design: Fach-Icon-Kachel links, volle
     Trennlinien über/unter jeder Zeile, Hover = Surface, aktiv = Fach-Ton.
     Fach-Farbe pro Zeile inline über --chi-fc / --chi-fc-bg / --chi-fc-ink.
     Markup: .chat-history-item > .chi-avatar + .chi-body(display:contents)
       > .chi-title + .chi-meta(.chi-dot .chi-ft(aus) .chi-fach(aus) .chi-thema .chi-time) ---- */
  .chat-history-list {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 0;
    margin: 0; padding: 0 0 8px;
  }
  .chi-body { display: contents; }
  .chi-dot, .chi-ft, .chi-fach { display: none; }
  .chat-history-item {
    display: grid; grid-template-columns: auto 1fr;
    grid-template-areas: "av title" "av meta";
    column-gap: 11px; row-gap: 3px; align-items: center;
    border: none; border-top: 1px solid var(--line); border-radius: 0;
    padding: 10px 10px 10px 11px; cursor: pointer;
    transition: background 120ms var(--ease-out);
  }
  .chat-history-list .chat-history-item:last-child { border-bottom: 1px solid var(--line); }
  .chi-avatar {
    grid-area: av; display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    background: var(--chi-fc-bg, var(--ink-100)); color: var(--chi-fc-ink, var(--ink-600));
    font-size: 0.78rem; font-weight: 700;
  }
  .chi-avatar svg { width: 16px; height: 16px; }
  .chi-title {
    grid-area: title; min-width: 0; font-size: 0.85rem; font-weight: 650; color: var(--ink-900);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chi-meta { grid-area: meta; display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--ink-500); }
  .chi-meta .chi-time { margin-left: auto; flex-shrink: 0; }
  .chi-meta .chi-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .chat-history-item:hover { background: var(--bg-surface); }
  .chat-history-item.is-active { background: var(--chi-fc-bg, var(--ink-50)); }
  .chat-history-item.is-active .chi-avatar { background: var(--chi-fc, var(--ink-950)); color: #fff; }
  .chat-history-item.is-active .chi-title { color: var(--chi-fc-ink, var(--ink-950)); }
  .chat-history-item.is-active .chi-meta { color: var(--ink-500); }
  .chat-history-empty { padding: 16px 10px; }

  /* Dunkles Design: die inline gesetzte helle Pastell-Fläche (--chi-fc-bg) und
     der dunkle --chi-fc-ink tragen auf dunklem Grund nicht — dunkle Fläche aus
     der Fachfarbe + heller Text. */
  :root[data-theme="dark"] .chi-avatar {
    background: color-mix(in srgb, var(--chi-fc, var(--ink-400)) 22%, var(--bg-surface));
    color: #e6ebef;
  }
  :root[data-theme="dark"] .chat-history-item.is-active {
    background: color-mix(in srgb, var(--chi-fc, var(--ink-400)) 15%, var(--bg-surface));
  }
  :root[data-theme="dark"] .chat-history-item.is-active .chi-title { color: var(--ink-950); }

  /* „Invertierte" Elemente (background: var(--ink-950)) tragen fest #fff-Text —
     im Dunkeln ist --ink-950 fast weiß, der Text also unsichtbar. Auf den
     mitdrehenden --paper-Ton heben. */
  :root[data-theme="dark"] .msg.from-user .msg-avatar,
  :root[data-theme="dark"] .mode-chip.is-active,
  :root[data-theme="dark"] .ev-a-mode.is-active { color: var(--paper); }

  /* ========= Verlauf-Fach-Filter — einklappbar =========
     Die 288px-Sidebar ist zu schmal für alle Fach-Pills wie auf der
     Klausuren-Seite — daher ein Button, der bei Bedarf ein Panel mit
     der Fach-Liste aufklappt (Einfachauswahl: ein Fach oder „Alle").
     Wird nur ab 2 Fächern mit Chats gerendert (JS). ================= */
  .vf-wrap { flex-shrink: 0; margin: 0 0 8px; }
  .vf-wrap:empty { display: none; }
  .vf-collapse { position: relative; }
  .vf-toggle {
    display: flex; align-items: center; gap: 7px; width: 100%; height: 32px;
    padding: 0 9px 0 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
    background: var(--bg-surface); color: var(--ink-700);
    font-family: inherit; font-size: 0.76rem; font-weight: 600;
  }
  .vf-toggle > svg:first-child { width: 13px; height: 13px; opacity: 0.7; flex-shrink: 0; }
  .vf-toggle .vf-toggle-label { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vf-toggle .vf-caret { width: 12px; height: 12px; flex-shrink: 0; transition: transform 140ms var(--ease-out); }
  .vf-collapse.is-open .vf-caret { transform: rotate(180deg); }
  .vf-panel {
    position: absolute; left: 0; right: 0; top: calc(100% + 5px); z-index: 20;
    background: var(--bg-surface); border: 1px solid var(--line);
    border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
    padding: 5px; max-height: 260px; overflow-y: auto;
  }
  .vf-panel[hidden] { display: none; }
  .vf-opt {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 7px 9px; border: none; border-radius: var(--radius-sm);
    background: transparent; color: var(--ink-800);
    font-family: inherit; font-size: 0.78rem; font-weight: 500; text-align: left;
  }
  .vf-opt:hover { background: var(--ink-50); }
  .vf-opt.is-active { color: var(--ink-950); font-weight: 700; }
  .vf-opt .vf-swatch { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--ink-300); }
  .vf-opt .vf-check { margin-left: auto; width: 14px; height: 14px; opacity: 0; }
  .vf-opt.is-active .vf-check { opacity: 1; }

  /* ---------------------------------------------------------
     Rechte Spalte — aktiver Chat oder leerer Zustand
     --------------------------------------------------------- */
  /* Chat-Fläche — hebt sich von der Verlauf-Spalte (flaches Canvas) ab
     durch ein kaum sichtbares Punktraster plus eine sanfte Vignette
     (Ränder minimal dunkler, Mitte hebt sich). Beide bleiben im
     „Fog Blue"-Canvas-Bereich — kein Wechsel auf Weiß. */
  .chat-main-wrap {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    position: relative; z-index: 0; overflow: hidden;
    background-color: var(--bg-canvas);
    background-image: radial-gradient(var(--ink-150) 0.9px, transparent 0.9px);
    background-size: 22px 22px; background-position: -1px -1px;
    box-shadow: inset 0 0 90px -46px rgba(16,18,20,0.30);
  }
  .chat-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  /* Wasserzeichen liegt ÜBER der Kopfzeile (nicht mehr dahinter) */
  .chat-main-wrap .page-watermark { top: -30px; right: -30px; width: 240px; height: 240px; z-index: 2; opacity: 0.06; }

  /* =========================================================
     Aktiver Chat — Messenger-Blasen beidseitig; die KI-Seite trägt
     die Fach-Farbe: KI-Avatar in Fach-Farbe mit Fach-SVG, KI-Blase
     zart getönt mit farbiger Kante links. Deine Blasen bleiben
     neutral. Kopfzeile mit Identitäts-Kachel (Fach-SVG), Start-
     Composer, Usage-Ring rechts neben dem zentrierten Composer.
     Fach-Farbe kommt inline über --cc-fc / --cc-fc-bg / --cc-fc-ink
     auf #chat-main. Fach-SVG: Lesify.getFachIcon(fachId), Fallback
     Modus-Icon (Kachel) bzw. Funken (KI-Avatar).
     ========================================================= */

  /* Kopfzeile — leichte Leiste auf Canvas, Identitäts-Kachel mit Fach-SVG */
  .chat-context {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 28px; flex-wrap: wrap; flex-shrink: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
  }
  .cc-idtile {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 32px; height: 32px; border-radius: 10px;
    background: var(--cc-fc, var(--ink-950)); color: #fff;
  }
  .cc-idtile svg { width: 16px; height: 16px; }
  .cc-stack { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .cc-eyebrow {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-400); line-height: 1;
  }
  .cc-thema2 {
    font-size: 0.85rem; font-weight: 600; color: var(--ink-900); line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Thread — Messenger, Lesespalte zentriert */
  .thread {
    flex: 1; overflow-y: auto;
    padding: 26px 24px 12px;
    display: flex; flex-direction: column; gap: 18px;
    scroll-behavior: smooth;
  }
  .thread > * { width: 100%; max-width: 720px; margin-inline: auto; }
  .msg { display: flex; align-items: flex-end; gap: 10px; animation: fade-up 320ms var(--ease-out); }
  .msg.from-user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .msg.from-ai .msg-avatar { background: var(--cc-fc, var(--ink-950)); color: #fff; padding: 6px; }
  .msg.from-ai .msg-avatar svg { width: 16px; height: 16px; }
  .msg.from-user .msg-avatar {
    background: var(--ink-950); color: #fff;
    font-size: 0.66rem; font-weight: 700; letter-spacing: 0.02em;
  }
  .msg-bubble {
    font-size: 0.9rem; line-height: 1.6; min-width: 0;
    padding: 10px 15px; border-radius: 18px; max-width: 74%;
  }
  /* KI-Blase — neutral (weiße Karte, Hairline, weicher Schatten);
     Farbe trägt allein der Fach-Avatar. Asymmetrischer Radius bleibt. */
  .msg.from-ai .msg-bubble {
    background: var(--bg-surface); color: var(--ink-900);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    border-radius: 18px 18px 18px 5px;
  }
  .msg.from-user .msg-bubble {
    background: var(--ink-950); color: var(--paper);
    border-radius: 18px 18px 5px 18px;
  }
  /* Markdown-Inhalt (LesifyUI.mdToHtml) in KI-Blasen */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 0.7em; }
  .md h2, .md h3, .md h4 { margin: 1em 0 0.4em; line-height: 1.3; font-weight: 700; }
  .md h2 { font-size: 1.05em; }
  .md h3 { font-size: 1em; }
  .md h4 { font-size: 0.95em; }
  .md ul, .md ol { margin: 0 0 0.7em; padding-left: 1.3em; }
  .md ul { list-style: disc; }
  .md li.md-task { list-style: none; margin-left: -1.1em; }
  .md ol { list-style: decimal; }
  .md li { margin: 0.2em 0; }
  .md strong { font-weight: 700; }
  .md blockquote { margin: 0 0 0.7em; padding: 8px 12px; background: var(--bg-canvas); border-radius: 10px; color: var(--ink-700, inherit); }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.86em; background: var(--bg-canvas); padding: 1px 5px; border-radius: 5px; }
  .md pre { margin: 0 0 0.7em; padding: 10px 12px; background: var(--bg-canvas); border-radius: 10px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 0.9em 0; }
  .md-table-wrap { overflow-x: auto; margin: 0 0 0.7em; }
  .md table { border-collapse: collapse; font-size: 0.92em; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 12px; text-align: left; }
  .md th { background: var(--bg-canvas); font-weight: 600; }
  .typing-dots { display: inline-flex; gap: 4px; padding: 8px 0; }
  .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-400); animation: typing-bounce 1.1s ease-in-out infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* Composer — identisch zum Start-Composer (.composer-empty),
     Canvas-Rand mit weichem Verlauf */
  .composer-wrap {
    flex-shrink: 0; position: relative;
    padding: 14px 24px 20px; background: transparent;
  }
  .composer-wrap::before {
    content: ''; position: absolute; left: 0; right: 0; top: -30px; height: 30px;
    background: linear-gradient(to top, var(--bg-canvas), transparent);
    pointer-events: none;
  }
  .composer-wrap > * { max-width: 720px; margin-inline: auto; }
  .suggest-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .composer {
    border: 1px solid var(--line-strong); border-radius: 24px;
    padding: 12px 12px 12px 20px;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--bg-surface); box-shadow: var(--shadow-md);
    transition: border-color 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
  }
  .composer:focus-within { border-color: var(--ink-500); box-shadow: var(--shadow-lg); }
  .composer textarea { flex: 1; border: none; resize: none; outline: none; font-family: inherit; font-size: 0.96rem; line-height: 1.5; max-height: 170px; padding: 9px 0; background: transparent; }
  .composer-hint { display: none; }

  /* Usage-Ring rechts neben dem zentrierten Composer — absolut
     positioniert am rechten Rand der 720er-Spalte, verschiebt den
     Composer nicht. Popover öffnet nach oben. */
  .composer-dock { position: relative; }
  .cc-usage-dock {
    position: absolute; top: 50%; left: 100%; transform: translateY(-50%);
    margin-left: 16px;
  }
  .cc-usage-dock .usage-popover { top: auto; bottom: calc(100% + 10px); }
  #cc-usage { display: none; }

  .attach-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.76rem; background: var(--ink-100); border-radius: var(--radius-full); padding: 4px 10px 4px 8px; margin-bottom: 10px; color: var(--ink-700); }

  /* ========= Usage-Indikator — Donut-Ring (Ampel) ==========
     Ein SVG-Ring (~40px): grauer Track + Fortschritts-Bogen mit runden
     Enden. Ampel-Ton über .usage-donut.is-* auf dem Bogen:
     0–33 % grün · 33–66 % gelb · 66–100 % rot.
     Popover + Hover/Klick bleiben global (initUsageWidget in app.js). */
  .usage-trigger {
    width: 40px; height: 40px; padding: 0; border: none; background: none;
    border-radius: 50%; cursor: pointer; display: inline-flex;
  }
  .usage-donut { width: 100%; height: 100%; overflow: visible; display: block; }
  .usage-donut-track { fill: none; stroke: var(--ink-150); stroke-width: 6; }
  .usage-donut-value {
    fill: none; stroke-width: 6; stroke-linecap: round; stroke: var(--gruen);
    transition: stroke-dasharray 500ms var(--ease-out), stroke 200ms var(--ease-out);
  }
  .usage-donut.is-empty .usage-donut-value { stroke-linecap: butt; }
  .usage-donut.is-gelb .usage-donut-value { stroke: var(--gelb); }
  .usage-donut.is-rot  .usage-donut-value { stroke: var(--rot); }

  /* ---------------------------------------------------------
     Leerer Zustand — zentriert, Claude-artig
     --------------------------------------------------------- */
  .chat-empty {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .chat-empty-inner { width: 100%; max-width: 640px; }
  .chat-empty-heading { text-align: center; margin-bottom: 28px; }
  .chat-empty-heading h1 { font-size: clamp(1.6rem, 1.3rem + 1.4vw, 2rem); margin-bottom: 10px; }
  .chat-empty-heading p { color: var(--ink-500); font-size: 0.93rem; }
  .mode-chip-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
  .mode-chip {
    display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 16px;
    border-radius: var(--radius-full); border: 1px solid var(--line-strong); background: var(--bg-surface);
    font-size: 0.83rem; font-weight: 600; color: var(--ink-700);
    transition: all 140ms var(--ease-out);
  }
  .mode-chip svg { width: 15px; height: 15px; }
  .mode-chip:hover { border-color: var(--ink-500); color: var(--ink-950); }
  .mode-chip.is-active { background: var(--ink-950); border-color: var(--ink-950); color: #fff; }
  .empty-picker-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .empty-picker-row .select { width: auto; min-width: 190px; height: 42px; font-size: 0.83rem; }
  .empty-new-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: -4px 0 14px; }
  .empty-new-row .input { width: auto; min-width: 220px; height: 42px; font-size: 0.83rem; }
  .composer-empty { padding: 12px 12px 12px 20px; border-radius: 24px; }
  .composer-empty textarea { font-size: 0.96rem; max-height: 170px; }
  .empty-suggest-chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .chat-empty .attach-chip { margin: 4px auto 12px; }
  .chat-empty #e-attach-preview { display: flex; justify-content: center; }

  /* =========================================================
     Empty-State — feste Anordnung:
       Überschrift → Fach/Thema-Picker („Etikett") → Composer → Modus-Pills.
     ========================================================= */

  /* ---- Modus-Pills unter dem Composer (aus „Fokus") ---- */
  .ev-a-modes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .ev-a-mode {
    display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px;
    border-radius: var(--radius-full); border: 1px solid var(--line);
    background: transparent; font-size: 0.8rem; font-weight: 500; color: var(--ink-600);
    transition: all 140ms var(--ease-out);
  }
  .ev-a-mode svg { width: 14px; height: 14px; opacity: 0.7; }
  .ev-a-mode:hover { border-color: var(--ink-400); color: var(--ink-950); background: var(--ink-50); }
  .ev-a-mode.is-active { background: var(--ink-950); border-color: var(--ink-950); color: #fff; }
  .ev-a-mode.is-active svg { opacity: 1; }

  /* ---- Fach/Thema-Picker — gemeinsamer Rahmen, sitzt über dem Composer ---- */
  .ev-pick { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .ev-pick .select:focus { box-shadow: none; outline: none; }

  /* „Etikett" — outlined Feld, Label auf der Rahmenlinie.
     Die vom Nutzer gewählte (und einzige) Picker-Variante. */
  .ev-pick-3 { align-items: stretch; }
  .ev-pick-3 .evp-out { position: relative; flex: 1 1 240px; }
  .ev-pick-3 .evp-out-label {
    position: absolute; top: -7px; left: 12px; z-index: 1; padding: 0 6px;
    background: var(--bg-surface);
    font-size: 0.64rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-500);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .ev-pick-3 .evp-out-label svg { width: 11px; height: 11px; }
  .ev-pick-3 .select {
    width: 100%; height: 52px; border: 1px solid var(--line-strong); border-radius: var(--radius-md);
    background-color: var(--bg-surface); padding: 0 40px 0 16px;
    font-family: var(--font-display); font-size: 0.92rem; font-weight: 600; color: var(--ink-950);
    transition: border-color 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
  }
  .ev-pick-3 .select:hover { border-color: var(--ink-400); }
  .ev-pick-3 .select:focus { border-color: var(--ink-950); box-shadow: 0 0 0 3px rgba(16,18,20,0.08) !important; }
  /* Nichts vorausgewählt: Platzhalter zurückhaltend, nicht wie eine echte Wahl */
  .ev-pick-3 .select.is-placeholder { color: var(--ink-400); font-weight: 500; }

  /* =========================================================
     Mitwachsende Eingabeleiste — greift, sobald die kompakte
     Menü-Sidebar aktiv ist (Dev-Switch: html.nav-compact, Regeln
     in style.css) und die Sidebar nicht gehovert wird:
       · Sidebar kompakt  → Eingabeleiste dehnt sich in den frei
         werdenden Platz, wird breiter als die Fach/Thema-Picker.
       · Sidebar gehovert → Eingabeleiste zurück auf Picker-Breite.
     Die Picker behalten immer ihre Breite, bleiben zentriert und
     gleiten per Layout weich mit.
     ========================================================= */
  @media (min-width: 861px) {
    html.nav-compact body[data-page="chat"] .chat-empty { overflow-x: clip; }
    html.nav-compact body[data-page="chat"] .chat-empty .composer-empty {
      position: relative; left: 50%; transform: translateX(-50%);
      width: 100%;
      transition: width 300ms var(--ease-out);
    }
    html.nav-compact:not(.nav-hovered) body[data-page="chat"] .chat-empty .composer-empty {
      width: max(100%, min(calc(100% + var(--nav-extra)), calc(100vw - 400px)));
    }
  }

  /* Zu schmal für den Usage-Ring neben dem Composer → zurück in die Kopfzeile. */
  @media (max-width: 1280px) {
    .cc-usage-dock { display: none; }
    #cc-usage { display: block; }
  }

  /* ---------------------------------------------------------
     Mobil
     --------------------------------------------------------- */
  @media (max-width: 860px) {
    .chat-context { padding-left: 18px; padding-right: 18px; }
    .thread, .composer-wrap { padding-left: 16px; padding-right: 16px; }
  }
  @media (max-width: 760px) {
    .chat-page-shell { flex-direction: column; }
    .chat-history-sidebar {
      width: 100%; border-right: none; border-bottom: 1px solid var(--line);
      flex-direction: row; align-items: center; padding: 12px 14px; gap: 10px;
    }
    .chat-history-sidebar .btn-block { width: auto; flex-shrink: 0; }
    .chat-history-headline { display: none; }
    .chat-history-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; margin: 0; padding: 0; }
    .chat-history-item { flex-shrink: 0; min-width: 168px; }
    .msg.from-user .msg-bubble { max-width: 88%; }
  }
</style>
</head>
<body data-page="chat">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="main-inner chat-page-main">
      <div class="chat-page-shell">
        <aside class="chat-history-sidebar">
          <button class="btn btn-primary btn-block" id="new-chat-btn"></button>
          <div class="chat-history-headline">Verlauf</div>
          <div class="vf-wrap" id="verlauf-filter"></div>
          <div class="chat-history-list" id="chat-history-list"></div>
        </aside>
        <div class="chat-main-wrap">
          <div class="page-watermark" id="page-watermark"></div>
          <div class="chat-main" id="chat-main"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="assets/js/api.js?v=20260923stream"></script>
<script src="assets/js/auth-gate.js"></script>
<script src="assets/js/app.js?v=20260919pdf"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var I = LesifyUI.Icons, R = LesifyUI.Render;

  document.getElementById('new-chat-btn').innerHTML = I.plus + ' Neuer Chat';

  var MODES = [
    { key: 'erklaeren', label: 'Thema erklären', sub: 'Konzepte verstehen', icon: 'spark' },
    { key: 'hausaufgaben', label: 'Hausaufgabenhilfe', sub: 'Konkrete Aufgabe lösen', icon: 'docCheck' },
    { key: 'ueben', label: 'Üben / Abfragen', sub: 'Wissen aktiv testen', icon: 'target' },
    { key: 'zusammenfassen', label: 'Zusammenfassen', sub: 'Inhalte kompakt bündeln', icon: 'book' }
  ];
  var MODE_LOOKUP = {}; MODES.forEach(function (m) { MODE_LOOKUP[m.key] = m; });

  /* Modus ist optional. Ohne gewählten Modus greifen diese neutralen
     Fallbacks (Kopfzeile, Vorschläge, Eröffnungstext). */
  var GENERIC_MODE = { key: null, label: 'Freie Frage', sub: 'Alles rund um dein Thema', icon: 'chat' };
  var GENERIC_SUGGESTIONS = ['Erkläre mir das Grundprinzip', 'Gib mir eine Beispielaufgabe dazu', 'Was sind typische Fehler?'];

  var SUGGESTIONS = {
    erklaeren: ['Erkläre anhand eines Beispiels', 'Gib mir dafür eine Beispielaufgabe', 'Was sind typische Fehler?'],
    hausaufgaben: ['Ich habe das versucht — schau mal drüber', 'Gib mir einen Tipp, keine Lösung', 'Erkläre den nächsten Schritt'],
    ueben: ['Stell mir eine Frage dazu', 'Nochmal, etwas schwerer', 'Wie war meine Antwort?'],
    zusammenfassen: ['Fasse meine letzten Chats zusammen', 'Nur die wichtigsten 5 Punkte', 'Als Stichpunkte bitte']
  };

  var MAX_FILE_BYTES = 5 * 1024 * 1024;
  var state = { chatId: null, fachId: null, themaId: null, mode: null, messages: [] };
  var pendingAttachmentFile = null;
  var verlaufFilter = '*'; // aktiver Fach-Filter im Verlauf ('*' = alle)
  var chatList = []; // lokaler Sync-Cache von Lesify.chats() für Verlauf-Spalte + Fach-Filter

  async function refreshChatsCache() { chatList = await Lesify.chats(); }

  /** `nachrichten` vom Server (`{rolle,text,anhangDateiId}`) → dieselbe Form
      wie im data.js-Prototyp (`{role,text,attachment}`) — Anhang-Dateiname
      wird pro Nachricht mit `anhangDateiId` einmalig nachgeladen. */
  function normalizeMessages(nachrichten) {
    return Promise.all((nachrichten || []).map(function (n) {
      var msg = { role: n.rolle, text: n.text };
      if (!n.anhangDateiId) return msg;
      return Lesify.getDatei(n.anhangDateiId).then(function (d) { msg.attachment = d.name; return msg; },
        function () { msg.attachment = 'Angehängte Datei'; return msg; });
    }));
  }

  function qsp() { return new URLSearchParams(window.location.search); }

  function pushUrl() {
    var qp = new URLSearchParams();
    if (state.chatId) qp.set('chat', state.chatId);
    else {
      if (state.fachId) qp.set('fach', state.fachId);
      if (state.themaId) qp.set('thema', state.themaId);
      if (state.mode) qp.set('mode', state.mode);
    }
    var qs = qp.toString();
    history.pushState(null, '', 'chat.html' + (qs ? '?' + qs : ''));
  }

  async function loadFromUrl() {
    var p = qsp();
    // Lernplan-Kontext (nur bei Deep-Links aus dem Lernplan gesetzt) — wird an den
    // entstehenden/fortgesetzten Chat weitergereicht, damit chat.html die chatId
    // in die chatMap des Lernplans zurückmelden kann.
    var lpLernplanId = p.get('lp') || null;
    var lpTag = p.get('lptag') || null;

    // Deep-Link mit fertigem Prompt (z. B. aus dem Lernplan): Eingabefeld
    // vorbelegen und fokussieren — bewusst NICHT automatisch senden. Gilt jetzt
    // auch bei Fortsetzung eines bestehenden Chats (chat=<id>).
    function applyPrefill() {
      var prefill = p.get('prompt');
      if (!prefill) return;
      var ci = document.getElementById('chat-input');
      if (ci) { ci.value = prefill; ci.dispatchEvent(new Event('input')); ci.focus(); }
    }

    var chatId = p.get('chat');
    if (chatId) {
      var c = await Lesify.getChat(chatId).catch(function () { return null; });
      if (c) {
        state = { chatId: c.id, fachId: c.fachId, themaId: c.themaId, mode: c.modus,
                  messages: await normalizeMessages(c.nachrichten), lpLernplanId: lpLernplanId, lpTag: lpTag };
        render();
        applyPrefill();
        return;
      }
    }
    var fachId = p.get('fach'), themaId = p.get('thema'), mode = p.get('mode') || null;
    if (mode && !MODE_LOOKUP[mode]) mode = null;
    if (fachId && themaId && Lesify.getFach(fachId) && Lesify.label(themaId).thema !== '—') {
      state = { chatId: null, fachId: fachId, themaId: themaId, mode: mode,
                messages: [{ role: 'ai', text: openingMessage(mode, { name: Lesify.label(themaId).thema }) }],
                lpLernplanId: lpLernplanId, lpTag: lpTag };
      render();
      applyPrefill();
      return;
    }
    state = { chatId: null, fachId: null, themaId: null, mode: null, messages: [], lpLernplanId: null, lpTag: null };
    render();
  }

  window.addEventListener('popstate', loadFromUrl);

  await Promise.all([Lesify.faecher(), Lesify.themen()]);
  await refreshChatsCache();

  function openingMessage(mode, thema) {
    if (mode === 'hausaufgaben') return 'Schick mir deine Aufgabe zu ' + thema.name + ' — am besten mit dem, was du schon probiert hast. Dann helfe ich dir Schritt für Schritt weiter.';
    if (mode === 'ueben') return 'Lass uns ' + thema.name + ' üben. Ich stelle dir Fragen dazu — antworte einfach, ich sage dir direkt, ob es passt.';
    if (mode === 'zusammenfassen') return 'Schick mir, was ich zu ' + thema.name + ' zusammenfassen soll — z. B. deine letzten Nachrichten, eine hochgeladene Datei, oder einfach den Umfang, den du brauchst.';
    return 'Womit soll ich dir bei ' + thema.name + ' helfen? Du kannst mich alles fragen — vom Grundprinzip bis zur konkreten Beispielaufgabe.';
  }

  /* ---------------------------------------------------------
     Sidebar — Chat-Verlauf
     --------------------------------------------------------- */

  function renderSidebar() {
    var chats = chatList; // bereits neueste zuerst (`GET /chats` sortiert nach aktualisiertAm desc)
    if (verlaufFilter !== '*') chats = chats.filter(function (c) { return c.fachId === verlaufFilter; });
    var list = document.getElementById('chat-history-list');
    list.innerHTML = chats.map(function (c) {
      var active = c.id === state.chatId ? ' is-active' : '';
      var lbl = Lesify.label(c.themaId);
      var fach = Lesify.getFach(c.fachId);
      var col = fach ? Lesify.getFachColor(fach.farbe) : null;
      var vars = col ? ' style="--chi-fc:' + col.base + ';--chi-fc-bg:' + col.bg + ';--chi-fc-ink:' + col.ink + '"' : '';
      var dotStyle = col ? ' style="background:' + col.base + '"' : '';
      var avatarInner = (typeof Lesify !== 'undefined' && Lesify.getFachIcon(c.fachId)) ||
        '<span>' + ((fach && fach.initial) || '?') + '</span>';
      return '<div class="chat-history-item' + active + '" data-chat-id="' + c.id + '" tabindex="0" role="button"' + vars + '>' +
        '<span class="chi-avatar">' + avatarInner + '</span>' +
        '<span class="chi-body">' +
          '<span class="chi-title">' + c.titel + '</span>' +
          '<span class="chi-meta">' +
            '<span class="chi-dot"' + dotStyle + '></span>' +
            '<span class="chi-ft">' + lbl.fach + ' · ' + lbl.thema + '</span>' +
            '<span class="chi-fach">' + lbl.fach + '</span>' +
            '<span class="chi-thema">' + lbl.thema + '</span>' +
            '<span class="chi-time">' + c.updated + '</span>' +
          '</span>' +
        '</span>' +
      '</div>';
    }).join('') || '<div class="chat-history-empty text-xs text-muted">' +
      (verlaufFilter !== '*' ? 'Keine Chats in diesem Fach.' : 'Noch keine Chats — starte oben deinen ersten.') + '</div>';

    LesifyUI.qsa('[data-chat-id]', list).forEach(function (el) {
      el.addEventListener('click', function () { openChat(el.getAttribute('data-chat-id')); });
    });
  }

  /* ---------------------------------------------------------
     Verlauf-Fach-Filter — einklappbarer Button + Panel.
     Einfachauswahl: ein Fach oder „Alle". Nur Fächer mit Chats,
     und erst ab 2 Fächern eingeblendet.
     --------------------------------------------------------- */

  var CARET_SVG = '<svg class="vf-caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg>';

  function verlaufFaecher() {
    var seen = {};
    chatList.forEach(function (c) { seen[c.fachId] = true; });
    return Lesify._faecherCache().filter(function (f) { return seen[f.id]; });
  }

  function renderVerlaufFilter() {
    var box = document.getElementById('verlauf-filter');
    if (!box) return;
    var faecher = verlaufFaecher();
    if (faecher.length < 2) { box.innerHTML = ''; return; } // Filter erst ab 2 Fächern sinnvoll
    var cur = verlaufFilter;
    var on = function (id) { return cur === id ? ' is-active' : ''; };
    var curFach = cur === '*' ? null : Lesify.getFach(cur);
    var label = curFach ? curFach.name : 'Alle Fächer';

    box.innerHTML = '<div class="vf-collapse" id="vf-collapse">' +
      '<button type="button" class="vf-toggle" id="vf-toggle">' + I.layers +
        '<span class="vf-toggle-label">' + label + '</span>' + CARET_SVG + '</button>' +
      '<div class="vf-panel" id="vf-panel" hidden>' +
        '<button type="button" class="vf-opt' + on('*') + '" data-vf-val="*"><span class="vf-swatch"></span>Alle Fächer' + I.check.replace('<svg', '<svg class="vf-check"') + '</button>' +
        faecher.map(function (f) {
          var col = Lesify.getFachColor(f.farbe);
          return '<button type="button" class="vf-opt' + on(f.id) + '" data-vf-val="' + f.id + '"><span class="vf-swatch" style="background:' + col.base + '"></span>' + f.name + I.check.replace('<svg', '<svg class="vf-check"') + '</button>';
        }).join('') +
      '</div>' +
    '</div>';
  }

  function setVerlaufFilter(val) {
    verlaufFilter = val || '*';
    renderVerlaufFilter();
    renderSidebar();
  }

  (function initVerlaufFilter() {
    var box = document.getElementById('verlauf-filter');
    if (!box) return;
    box.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-vf-val]');
      if (btn) { setVerlaufFilter(btn.getAttribute('data-vf-val')); return; }
      var toggle = e.target.closest('#vf-toggle');
      if (toggle) {
        var col = document.getElementById('vf-collapse');
        var pnl = document.getElementById('vf-panel');
        if (pnl) { pnl.hidden = !pnl.hidden; col.classList.toggle('is-open', !pnl.hidden); }
      }
    });
    document.addEventListener('click', function (e) {
      var pnl = document.getElementById('vf-panel');
      if (pnl && !pnl.hidden && !e.target.closest('#vf-collapse')) {
        pnl.hidden = true;
        var col = document.getElementById('vf-collapse'); if (col) col.classList.remove('is-open');
      }
    });
  })();

  async function openChat(chatId) {
    var c = await Lesify.getChat(chatId).catch(function () { return null; });
    if (!c) return;
    state = { chatId: c.id, fachId: c.fachId, themaId: c.themaId, mode: c.modus,
              messages: await normalizeMessages(c.nachrichten), lpLernplanId: null, lpTag: null };
    pushUrl(); render();
  }

  document.getElementById('new-chat-btn').addEventListener('click', function () {
    state = { chatId: null, fachId: null, themaId: null, mode: null, messages: [], lpLernplanId: null, lpTag: null };
    pushUrl(); render();
  });

  /* ---------------------------------------------------------
     Render-Dispatch
     --------------------------------------------------------- */

  function render() {
    renderVerlaufFilter();
    renderSidebar();
    if (state.chatId || (state.fachId && state.themaId)) renderActive();
    else renderEmpty();
  }

  /* ---------------------------------------------------------
     Leerer Zustand — feste Anordnung:
       Überschrift → Fach/Thema-Picker („Etikett"-Design) →
       Composer → Modus-Pills → Vorschläge.
     Die Eingabeleiste wird per CSS breiter als die Picker,
     sobald die Menü-Sidebar in ihren kompakten Zustand geht
     (siehe <style>-Block „Kompakte Menü-Sidebar").
     --------------------------------------------------------- */

  function renderEmpty() {
    pendingAttachmentFile = null;
    var chosenMode = null;
    var eInput = null;

    var FS = '<select class="select" id="e-fach" aria-label="Fach"></select>';
    var TS = '<select class="select" id="e-thema" aria-label="Thema"></select>';
    var NEW_ROWS =
      '<div class="empty-new-row" id="e-new-fach-row" style="display:none"><input class="input" id="e-fach-neu" type="text" placeholder="Neuer Fachname, z. B. Physik" aria-label="Neuer Fachname"></div>' +
      '<div class="empty-new-row" id="e-new-thema-row" style="display:none"><input class="input" id="e-thema-neu" type="text" placeholder="Neues Thema, z. B. Optik" aria-label="Neues Thema"></div>';

    var picker =
      '<div class="ev-pick ev-pick-3">' +
        '<div class="evp-out"><span class="evp-out-label">' + I.layers + ' Fach</span>' + FS + '</div>' +
        '<div class="evp-out"><span class="evp-out-label">' + I.book + ' Thema</span>' + TS + '</div>' +
      '</div>';

    document.getElementById('chat-main').innerHTML =
      '<div class="chat-empty">' +
        '<div class="chat-empty-inner">' +
          '<div class="chat-empty-heading"><h1>Wie kann ich dir helfen?</h1><p>Wähle Fach und Thema — dann leg direkt los. Ein Modus ist optional.</p></div>' +
          picker +
          NEW_ROWS +
          '<div id="e-attach-preview"></div>' +
          '<div class="composer composer-empty">' +
            '<button class="icon-btn" id="e-attach-btn" style="border:none;background:transparent" aria-label="Datei anhängen">' + I.paperclip + '</button>' +
            '<input type="file" id="e-file-input" style="display:none">' +
            '<textarea id="e-input" rows="1" placeholder="Schreib deine Frage…"></textarea>' +
            '<button class="btn btn-primary btn-sm" id="e-send" style="width:38px;height:38px;padding:0;border-radius:10px" aria-label="Senden">' + I.send + '</button>' +
          '</div>' +
          '<div class="ev-a-modes" id="e-mode-row">' +
            MODES.map(function (m) { return '<button type="button" class="ev-a-mode" data-mode="' + m.key + '"><span class="spark">' + I[m.icon] + '</span>' + m.label + '</button>'; }).join('') +
          '</div>' +
          '<div class="empty-suggest-chips" id="e-suggest"></div>' +
        '</div>' +
      '</div>';

    /* Modus-Pills unter dem Composer */
    function renderSuggest(key) {
      var box = document.getElementById('e-suggest');
      if (!box) return;
      box.innerHTML = key ? SUGGESTIONS[key].map(function (s) { return '<button type="button" class="chip suggest-chip">' + s + '</button>'; }).join('') : '';
      LesifyUI.qsa('.suggest-chip', box).forEach(function (chip) {
        chip.addEventListener('click', function () { if (eInput) { eInput.value = chip.textContent; eInput.focus(); } });
      });
    }
    function applyMode(key) {
      if (key && key === chosenMode) key = null; // erneuter Klick auf die aktive Pille hebt die Auswahl auf
      chosenMode = key || null;
      LesifyUI.qsa('[data-mode]').forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-mode') === chosenMode); });
      renderSuggest(chosenMode);
    }
    LesifyUI.qsa('[data-mode]').forEach(function (btn) {
      btn.addEventListener('click', function () { applyMode(btn.getAttribute('data-mode')); });
    });

    /* Fach / Thema — in jedem Design zwei <select id="e-fach"/"e-thema"> */
    var eFach = document.getElementById('e-fach'), eThema = document.getElementById('e-thema');
    var eNewFachRow = document.getElementById('e-new-fach-row'), eNewThemaRow = document.getElementById('e-new-thema-row');
    var FACH_PLACEHOLDER = '<option value="" disabled selected hidden>Fach wählen…</option>';
    var THEMA_PLACEHOLDER = '<option value="" disabled selected hidden>Thema wählen…</option>';

    // Nichts ist vorausgewählt — beide Selects starten auf dem Platzhalter.
    function markPlaceholder(sel) { sel.classList.toggle('is-placeholder', !sel.value); }

    eFach.innerHTML = FACH_PLACEHOLDER +
      Lesify._faecherCache().map(function (f) { return '<option value="' + f.id + '">' + f.name + '</option>'; }).join('') +
      '<option value="__new__">+ Neues Fach erstellen</option>';

    async function populateThemen() {
      markPlaceholder(eFach);
      var fid = eFach.value;
      if (!fid) {
        eNewFachRow.style.display = 'none';
        eThema.innerHTML = '<option value="" disabled selected hidden>Erst Fach wählen…</option>';
        eNewThemaRow.style.display = 'none';
        markPlaceholder(eThema);
        return;
      }
      if (fid === '__new__') {
        eNewFachRow.style.display = 'flex';
        eThema.innerHTML = '<option value="__new__">+ Neues Thema erstellen</option>';
        eNewThemaRow.style.display = 'flex';
        markPlaceholder(eThema);
        return;
      }
      eNewFachRow.style.display = 'none';
      eThema.innerHTML = THEMA_PLACEHOLDER + '<option value="__new__">+ Neues Thema erstellen</option>';
      markPlaceholder(eThema);
      var themenListe = await Lesify.themenFuerFach(fid);
      if (eFach.value !== fid) return; // Fach wurde inzwischen gewechselt
      eThema.innerHTML = THEMA_PLACEHOLDER +
        themenListe.map(function (t) { return '<option value="' + t.id + '">' + t.name + '</option>'; }).join('') +
        '<option value="__new__">+ Neues Thema erstellen</option>';
      eNewThemaRow.style.display = 'none';
      markPlaceholder(eThema);
    }
    eFach.addEventListener('change', populateThemen);
    eThema.addEventListener('change', function () {
      markPlaceholder(eThema);
      eNewThemaRow.style.display = eThema.value === '__new__' ? 'flex' : 'none';
    });
    populateThemen();

    /* Composer */
    eInput = document.getElementById('e-input');
    document.getElementById('e-attach-btn').addEventListener('click', function () { document.getElementById('e-file-input').click(); });
    document.getElementById('e-file-input').addEventListener('change', function (e) {
      if (!e.target.files.length) return;
      var file = e.target.files[0];
      if (file.size > MAX_FILE_BYTES) { LesifyUI.toast('„' + file.name + '" ist größer als 5 MB — bitte kleinere Datei wählen.'); e.target.value = ''; return; }
      pendingAttachmentFile = file;
      document.getElementById('e-attach-preview').innerHTML = '<span class="attach-chip">' + file.name + '<span style="cursor:pointer" id="e-attach-remove">' + I.x + '</span></span>';
      document.getElementById('e-attach-remove').addEventListener('click', function () { pendingAttachmentFile = null; document.getElementById('e-attach-preview').innerHTML = ''; });
      e.target.value = '';
    });
    eInput.addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(170, this.scrollHeight) + 'px'; });
    eInput.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); trySend(); } });
    document.getElementById('e-send').addEventListener('click', trySend);

    async function trySend() {
      var text = (eInput && eInput.value.trim()) || '';
      if (!text && !pendingAttachmentFile) { if (eInput) eInput.focus(); return; }
      var fSel = document.getElementById('e-fach'), tSel = document.getElementById('e-thema');
      var fid = fSel ? fSel.value : null;
      if (fid === '__new__') {
        var fn = (document.getElementById('e-fach-neu').value || '').trim();
        if (!fn) { document.getElementById('e-fach-neu').focus(); return; }
        fid = (await Lesify.addFach({ name: fn })).id;
      }
      var tid = tSel ? tSel.value : null;
      var themaName = tSel && tSel.selectedOptions[0] ? tSel.selectedOptions[0].textContent : '—';
      if (tid === '__new__') {
        var tn = (document.getElementById('e-thema-neu').value || '').trim();
        if (!tn) { document.getElementById('e-thema-neu').focus(); return; }
        tid = (await Lesify.addThema({ fachId: fid, name: tn })).id;
        themaName = tn;
      }
      if (!fid || !tid) { if (fSel && !fid) fSel.focus(); else if (tSel) tSel.focus(); return; }

      var chat = await Lesify.addChat({ fachId: fid, themaId: tid, modus: chosenMode });
      state = { chatId: chat.id, fachId: fid, themaId: tid, mode: chosenMode,
                messages: [{ role: 'ai', text: openingMessage(chosenMode, { name: themaName }) }] };
      pushUrl();
      await refreshChatsCache();
      renderVerlaufFilter();
      renderSidebar();
      renderActive();
      sendMessage(text, pendingAttachmentFile);
    }
  }

  /* ---------------------------------------------------------
     Aktiver Chat — Verlauf + Composer am unteren Rand
     --------------------------------------------------------- */

  function renderActive() {
    pendingAttachmentFile = null;
    var modeInfo = MODE_LOOKUP[state.mode] || GENERIC_MODE;
    var ccLbl = Lesify.label(state.themaId);
    var ccFach = Lesify.getFach(state.fachId);
    var ccCol = ccFach ? Lesify.getFachColor(ccFach.farbe) : null;
    var ccVars = ccCol ? '--cc-fc:' + ccCol.base + ';--cc-fc-bg:' + ccCol.bg + ';--cc-fc-ink:' + ccCol.ink + ';' : '';
    var modeIcon = I[modeInfo.icon];
    /* Fach-Farb-Variablen auf #chat-main — gemeinsamer Vorfahr von
       Kopfzeile, Thread und Composer, damit Thread/Composer sie erben. */
    var chatMain = document.getElementById('chat-main');
    chatMain.setAttribute('style', ccVars);
    chatMain.innerHTML =
      '<div class="chat-context">' +
        '<span class="cc-idtile">' + fachIconSvg(modeIcon) + '</span>' +
        '<div class="cc-stack">' +
          '<span class="cc-eyebrow">' + modeInfo.label + '</span>' +
          '<span class="cc-thema2">' + ccLbl.fach + ' · ' + ccLbl.thema + '</span>' +
        '</div>' +
        '<div style="margin-left:auto" id="cc-usage"></div>' +
      '</div>' +
      '<div class="thread" id="thread"></div>' +
      '<div class="composer-wrap">' +
        '<div class="suggest-chips" id="suggest-chips"></div>' +
        '<div id="attach-preview"></div>' +
        '<div class="composer-dock">' +
          '<div class="composer">' +
            '<button class="icon-btn" id="attach-btn" style="border:none;background:transparent" aria-label="Datei anhängen">' + I.paperclip + '</button>' +
            '<input type="file" id="chat-file-input" style="display:none">' +
            '<textarea id="chat-input" rows="1" placeholder="Antwort schreiben…"></textarea>' +
            '<button class="btn btn-primary btn-sm" id="send-btn" style="width:38px;height:38px;padding:0;border-radius:10px" aria-label="Senden">' + I.send + '</button>' +
          '</div>' +
          '<div class="cc-usage-dock" id="cc-usage-dock"></div>' +
        '</div>' +
        '<p class="composer-hint">Lesify kann Fehler machen — prüfe wichtige Angaben nach. Antworten sind keine offizielle Leistungsbewertung durch die Schule.</p>' +
      '</div>';

    if (!state.messages.length) state.messages = [{ role: 'ai', text: openingMessage(state.mode, { name: Lesify.label(state.themaId).thema }) }];
    renderThread(); renderSuggestions();
    refreshUsage();

    var input = document.getElementById('chat-input');
    input.addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(140, this.scrollHeight) + 'px'; });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
    document.getElementById('send-btn').addEventListener('click', submit);

    document.getElementById('attach-btn').addEventListener('click', function () { document.getElementById('chat-file-input').click(); });
    document.getElementById('chat-file-input').addEventListener('change', function (e) {
      if (!e.target.files.length) return;
      var file = e.target.files[0];
      if (file.size > MAX_FILE_BYTES) { LesifyUI.toast('„' + file.name + '" ist größer als 5 MB — bitte kleinere Datei wählen.'); e.target.value = ''; return; }
      pendingAttachmentFile = file;
      document.getElementById('attach-preview').innerHTML = '<span class="attach-chip">' + file.name + '<span style="cursor:pointer" id="attach-remove">' + I.x + '</span></span>';
      document.getElementById('attach-remove').addEventListener('click', function () { pendingAttachmentFile = null; document.getElementById('attach-preview').innerHTML = ''; });
      e.target.value = '';
    });

    async function submit() {
      var text = input.value.trim();
      if (!text && !pendingAttachmentFile) return;
      var att = pendingAttachmentFile;
      input.value = ''; input.style.height = 'auto';
      // Deep-Link-Zustand (chatId === null): beim allerersten Absenden einen Chat
      // anlegen — sonst lebt der Verlauf nur in state.messages und ist nach Reload
      // oder Chip-Wechsel weg. Gleiche addChat-Signatur wie trySend() im leeren Zustand.
      if (!state.chatId) {
        var chat = await Lesify.addChat({ fachId: state.fachId, themaId: state.themaId, modus: state.mode });
        state.chatId = chat.id;
        pushUrl();
        await refreshChatsCache();
        renderVerlaufFilter();
      }
      sendMessage(text, att);
    }
  }

  function renderSuggestions() {
    var box = document.getElementById('suggest-chips');
    if (!box) return;
    if (state.messages.length > 3) { box.innerHTML = ''; return; }
    box.innerHTML = (SUGGESTIONS[state.mode] || GENERIC_SUGGESTIONS).map(function (s) { return '<button type="button" class="chip suggest-chip">' + s + '</button>'; }).join('');
    LesifyUI.qsa('.suggest-chip', box).forEach(function (chip) {
      chip.addEventListener('click', function () {
        var input = document.getElementById('chat-input');
        input.value = chip.textContent; input.focus();
      });
    });
  }

  // Fach-SVG des aktiven Chats (Icon aus der Preset-Bibliothek).
  // Fallback, wenn das Fach kein eigenes Icon hat (z. B. selbst angelegt).
  function fachIconSvg(fallback) {
    var svg = (typeof Lesify !== 'undefined') ? Lesify.getFachIcon(state.fachId) : null;
    return svg || fallback;
  }

  // Markdown-Helfer mit Fallback: falls ein gecachtes, älteres app.js noch kein
  // LesifyUI.mdToHtml kennt, bleibt der Verlauf lesbar statt leer zu rendern.
  function escSafe(t) { return (window.LesifyUI && LesifyUI.mdEscape) ? LesifyUI.mdEscape(t) : String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function mdSafe(t, o) { return (window.LesifyUI && LesifyUI.mdToHtml) ? LesifyUI.mdToHtml(t, o) : escSafe(t).replace(/\n/g, '<br>'); }

  // Initialen der angemeldeten Person für den Nutzer-Avatar (statt fest „JB").
  var userInitials = '';
  try { Lesify.getUser().then(function (u) { userInitials = (u && u.initials) || ''; if (state && state.messages) renderThread(); }, function () {}); } catch (e) {}

  function renderThread() {
    var thread = document.getElementById('thread');
    if (!thread) return;
    var aiAvatar = fachIconSvg(I.spark);
    thread.innerHTML = state.messages.map(function (m) {
      if (m.role === 'ai') return '<div class="msg from-ai"><span class="msg-avatar">' + aiAvatar + '</span><span class="msg-bubble md">' + mdSafe(m.text) + '</span></div>';
      var att = m.attachment ? '<div style="margin-top:8px"><span class="attach-chip" style="background:rgba(255,255,255,0.15);color:#fff">' + I.paperclip + m.attachment + '</span></div>' : '';
      return '<div class="msg from-user"><span class="msg-avatar">' + userInitials + '</span><span class="msg-bubble">' + escSafe(m.text).replace(/\n/g, '<br>') + att + '</span></div>';
    }).join('');
    thread.scrollTop = thread.scrollHeight;
  }

  function showTyping() {
    var thread = document.getElementById('thread');
    if (!thread) return;
    var el = document.createElement('div');
    el.className = 'msg from-ai'; el.id = 'typing-msg';
    el.innerHTML = '<span class="msg-avatar">' + fachIconSvg(I.spark) + '</span><span class="msg-bubble"><span class="typing-dots"><span></span><span></span><span></span></span></span>';
    thread.appendChild(el);
    thread.scrollTop = thread.scrollHeight;
  }
  function hideTyping() { var el = document.getElementById('typing-msg'); if (el) el.remove(); }

  /* ---------------------------------------------------------
     Usage-Indikator — Donut-Ring mit runden Enden, Ampel-Ton.
     Schwellen: 0–33 % grün · 33–66 % gelb · 66–100 % rot.
     Popover + Hover/Klick sind global (initUsageWidget in app.js);
     hier wird nur der Trigger („die Kreis-Anzeige") gebaut. */

  function uwClampR(n) { return Math.max(0, Math.min(1, n || 0)); }
  function uwRatioCls(r) { return r >= 0.66 ? 'is-rot' : (r >= 0.33 ? 'is-gelb' : 'is-gruen'); }
  function uwRatioOf(d) { return d.limit == null ? 0 : uwClampR(d.used / d.limit); }
  function uwRow(label, d) {
    var unlimited = d.limit == null;
    var ratio = uwRatioOf(d);
    var count = unlimited ? (d.used + ' / ∞') : (d.used + ' / ' + d.limit);
    return '<div class="usage-row"><div class="usage-row-head"><span>' + label + '</span>' +
      '<span class="mono">' + count + '</span></div>' +
      '<div class="usage-bar"><div class="usage-bar-fill ' + (unlimited ? 'is-gruen' : uwRatioCls(ratio)) + '" style="transform:scaleX(' + ratio + ')"></div></div></div>';
  }

  // SVG-Donut: grauer Track + Fortschritts-Bogen (runde Enden) im Ampel-Ton.
  function usageDonut(ratio, cls) {
    var r = 15, circ = 2 * Math.PI * r;
    var dash = Math.max(ratio, 0) * circ;
    return '<svg class="usage-donut ' + cls + (ratio <= 0 ? ' is-empty' : '') + '" viewBox="0 0 40 40" aria-hidden="true">' +
      '<g transform="rotate(-90 20 20)">' +
        '<circle class="usage-donut-track" cx="20" cy="20" r="' + r + '"/>' +
        '<circle class="usage-donut-value" cx="20" cy="20" r="' + r + '" stroke-dasharray="' + dash + ' ' + circ + '"/>' +
      '</g>' +
    '</svg>';
  }

  async function renderUsage() {
    if (typeof Lesify === 'undefined') return '';
    var u = await Lesify.usage().catch(function () { return null; });
    if (!u) return '';
    var overall = Math.max(
      uwRatioOf(u.nachrichten), uwRatioOf(u.dateien),
      uwRatioOf(u.lernzettel), uwRatioOf(u.testklausuren)
    );

    return '<div class="usage-widget">' +
      '<button class="usage-trigger" type="button" aria-label="Nutzung anzeigen">' + usageDonut(overall, uwRatioCls(overall)) + '</button>' +
      '<div class="usage-popover">' +
        '<div class="usage-popover-title">Monatliche Nutzung · ' + (u.planName || '') + '</div>' +
        uwRow('Nachrichten', u.nachrichten) +
        uwRow('Content-Aufnahmen', u.dateien) +
        uwRow('Lernzettel', u.lernzettel) +
        uwRow('Testklausuren', u.testklausuren) +
        '<div class="usage-reset">Setzt sich zurück am ' + R.formatDatum(u.resetDatum) + '</div>' +
      '</div>' +
    '</div>';
  }

  async function refreshUsage() {
    var html = await renderUsage();
    ['cc-usage', 'cc-usage-dock'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.innerHTML = html;
    });
  }

  /** Lädt einen ausgewählten Anhang hoch und wartet auf die Verarbeitung
      (Text-Extraktion + Zusammenfassung), bevor die Nachricht abgeschickt
      wird — der Server braucht `anhangDateiId` einer bereits `bereit`en
      Datei, um sie dem KI-Kontext beizulegen (§3/§6). */
  async function hochladenFuerNachricht(file) {
    var datei = await Lesify.uploadDatei(state.themaId, file);
    datei = await Lesify.pollDateiStatus(datei.id);
    if (datei.status !== 'bereit') {
      LesifyUI.toast('„' + file.name + '" konnte nicht verarbeitet werden — die Nachricht wird ohne Anhang gesendet.');
      return null;
    }
    return datei.id;
  }

  async function sendMessage(text, attachmentFile) {
    var anhangDateiId = null;
    if (attachmentFile) {
      anhangDateiId = await hochladenFuerNachricht(attachmentFile).catch(function (err) {
        LesifyUI.toast(Lesify.fehlerText(err));
        return null;
      });
    }

    var displayText = text || 'Schau dir bitte die angehängte Datei an.';
    state.messages.push({ role: 'user', text: displayText, attachment: attachmentFile ? attachmentFile.name : null });
    pendingAttachmentFile = null;
    var preview = document.getElementById('attach-preview'); if (preview) preview.innerHTML = '';
    renderSidebar();
    renderThread(); renderSuggestions();
    showTyping();

    var extra = {};
    if (anhangDateiId) extra.anhangDateiId = anhangDateiId;
    // Lernplan-Deep-Link: der Server schreibt die chatId serverseitig in die
    // chatMap des Lernplans, sobald `lernplanKontext` mitgeschickt wird —
    // kein separater Client-Call mehr nötig (anders als im data.js-Prototyp).
    if (state.lpLernplanId && state.lpTag) {
      extra.lernplanKontext = { lernplanId: state.lpLernplanId, tag: Number(state.lpTag) };
    }

    // Streaming: beim ersten Textstück ersetzt eine echte Blase die
    // Tipp-Punkte, danach wird nur diese Blase aktualisiert (max. 1× pro Frame).
    var live = null;
    var geplant = false;
    extra.onDelta = function (stueck) {
      if (!live) {
        hideTyping();
        live = { role: 'ai', text: '' };
        state.messages.push(live);
        renderThread();
      }
      live.text += stueck;
      if (geplant) return;
      geplant = true;
      requestAnimationFrame(function () {
        geplant = false;
        var blasen = document.querySelectorAll('#thread .msg.from-ai .msg-bubble');
        var blase = blasen[blasen.length - 1];
        if (blase) blase.innerHTML = mdSafe(live.text);
        var thread = document.getElementById('thread');
        if (thread) thread.scrollTop = thread.scrollHeight;
      });
    };

    try {
      var res = await Lesify.appendChatMessages(state.chatId, displayText, extra);
      hideTyping();
      var aiEntry = res.nachrichten.filter(function (n) { return n.rolle === 'ai'; })[0];
      if (live) live.text = aiEntry ? aiEntry.text : live.text;
      else if (aiEntry) state.messages.push({ role: 'ai', text: aiEntry.text });
      await refreshChatsCache();
      refreshUsage();
      renderSidebar();
      renderThread(); renderSuggestions();
    } catch (err) {
      hideTyping();
      // Abgebrochener Stream: die halbe Antwort wurde nicht gespeichert → weg.
      if (live) state.messages.splice(state.messages.indexOf(live), 1);
      LesifyUI.toast(Lesify.fehlerText(err));
      renderThread(); renderSuggestions();
    }
  }

  await loadFromUrl();
});
</script>
</body>
</html>
