<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fach-Icons – Auswahl</title>
<style>
  :root {
    --paper: oklch(0.985 0.004 240);
    --surface: #fff;
    --ink: oklch(0.2 0.02 240);
    --ink-soft: oklch(0.5 0.02 240);
    --line: oklch(0.91 0.008 240);
    --accent: oklch(0.2 0.02 240);
    --sel-bg: oklch(0.96 0.03 240);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; padding-bottom: 96px; }
  header { padding: 32px 32px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--ink-soft); }
  .tools { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .tools label { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
  .tools input[type=range] { width: 140px; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px 32px; display: grid; gap: 16px; }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px 20px; }
  section.done { border-color: var(--accent); }
  section h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 10px; }
  section h2 .pick { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px 8px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; font: inherit; color: inherit; transition: border-color .15s, background .15s; }
  .opt:hover { border-color: var(--ink-soft); }
  .opt.sel { border-color: var(--accent); background: var(--sel-bg); box-shadow: 0 0 0 1px var(--accent); }
  .big svg { width: var(--size, 48px); height: var(--size, 48px); display: block; }
  .small { display: flex; align-items: center; gap: 6px; color: var(--ink-soft); font-size: 12px; }
  .small svg { width: 20px; height: 20px; }
  .tag { font-size: 11px; color: var(--ink-soft); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 32px; display: flex; gap: 16px; align-items: center; justify-content: space-between; }
  .bar button { font: inherit; font-weight: 600; background: var(--ink); color: #fff; border: 0; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
  .bar button.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); font-weight: 500; }
  @media (max-width: 720px) { .row { grid-template-columns: repeat(3, 1fr); } header, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>

<header>
  <h1>Fach-Icons – Auswahl</h1>
  <p>Pro Fach 5 Varianten. Klick wählt eine aus (Variante 1 = aktuelles Icon aus <code>data.js</code>). Die Auswahl bleibt im Browser gespeichert.</p>
  <div class="tools">
    <label>Größe <input id="size" type="range" min="24" max="80" value="48"></label>
  </div>
</header>
<main id="main"></main>
<div class="bar">
  <span id="status"></span>
  <span style="display:flex;gap:8px">
    <button class="ghost" id="reset">Zurücksetzen</button>
    <button id="copy">Auswahl kopieren</button>

</div>

    '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    '<path d="M5 8h14l-1 13H6Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>'
  ]
};

function wrap(inner) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
}

var NEU = { deutsch: 1, englisch: 1, franzoesisch: 1, spanisch: 1 };
var KEY = 'lesify:fachIconPick';
var picks = {};
try { picks = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

function save() { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) {} }

function render() {
  var html = '';
  Object.keys(NAMES).forEach(function (id) {
    var p = picks[id];
    html += '<section' + (p ? ' class="done"' : '') + '><h2>' + NAMES[id] +
      '<span class="pick">' + (p ? 'Variante ' + p + ' gewählt' : 'noch offen') + '</span></h2><div class="row">';
    ICONS[id].forEach(function (inner, i) {
      var n = i + 1;
      html += '<button class="opt' + (p === n ? ' sel' : '') + '" data-f="' + id + '" data-n="' + n + '">' +
        '<span class="big">' + wrap(inner) + '</span>' +
        '<span class="small">' + wrap(inner) + '<span class="tag">' + n + (n === 1 && !NEU[id] ? ' · aktuell' : '') + '</span></span></button>';
    });
    html += '</div></section>';
  });
  document.getElementById('main').innerHTML = html;
  var count = Object.keys(picks).length;
  document.getElementById('status').textContent = count + ' von ' + Object.keys(NAMES).length + ' Fächern gewählt';
}

document.getElementById('main').addEventListener('click', function (e) {
  var b = e.target.closest('.opt');
  if (!b) return;
  var f = b.dataset.f, n = +b.dataset.n;
  if (picks[f] === n) delete picks[f]; else picks[f] = n;
  save(); render();
});

document.getElementById('size').addEventListener('input', function (e) {
  document.documentElement.style.setProperty('--size', e.target.value + 'px');
});

document.getElementById('reset').addEventListener('click', function () {
  picks = {}; save(); render();
});

document.getElementById('copy').addEventListener('click', function () {
  var txt = Object.keys(NAMES).map(function (id) {
    return NAMES[id] + ': ' + (picks[id] ? 'Variante ' + picks[id] : '—');
  }).join('\n');
  var btn = this;
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () {
    btn.textContent = 'Kopiert ✓'; setTimeout(function () { btn.textContent = 'Auswahl kopieren'; }, 1500);
  }, function () { window.prompt('Auswahl:', txt.replace(/\n/g, ' | ')); });
});

render();
</script>
</body>
</html>
