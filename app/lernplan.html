<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernplan · Lesify</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>(function(){try{var d=JSON.parse(localStorage.getItem("lesify_db_v2")||"null");if(d&&d.settingsOverride&&d.settingsOverride.darkMode)document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
</head>
<body data-page="klausuren">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="main-inner">

      <a href="#" class="section-link" id="back-link" style="margin-bottom:18px;display:inline-flex">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        <span id="back-label">Zurück</span>
      </a>

      <div id="lp-body"></div>

    </main>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth-gate.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var R = LesifyUI.Render;

  var params = new URLSearchParams(window.location.search);
  var lernplanId = params.get('id');
  var lp = null;
  try {
    if (lernplanId) lp = await Lesify.getLernplan(lernplanId);
    // Fallback: ?klausur=<id> → Lernplan der Klausur.
    else if (params.get('klausur')) lp = await Lesify.getLernplanFuerKlausur(params.get('klausur'));
  } catch (err) {
    lp = null;
  }

  if (!lp) {
    document.getElementById('back-link').href = 'klausuren.html';
    document.getElementById('back-label').textContent = 'Zu den Klausuren';
    document.getElementById('lp-body').innerHTML =
      '<div class="page-head"><div><h1 class="page-title">Lernplan nicht gefunden</h1>' +
      '<p class="page-sub">Zu dieser Klausur gibt es keinen Lernplan.</p></div></div>';
    return;
  }
  lernplanId = lp.id;

  // Fächer-/Themen-Cache warm halten — fachColorVars()/getFach()/badge()/
  // label() lesen synchron daraus (Lehre aus fach.html/klausuren.html: ohne
  // das zeigen Thema-Badges "—" statt Fach/Thema). Das eingebettete
  // lp.klausur erspart einen eigenen Lesify.getKlausur()-Aufruf.
  var fachId = lp.klausur ? lp.klausur.fachId : (lp.testklausur1 ? lp.testklausur1.fachId : null);
  await Promise.all([Lesify.faecher(), fachId ? Lesify.themenFuerFach(fachId) : Lesify.themen()]);
  var k = lp.klausur;
  if (k) {
    var fach = Lesify.getFach(k.fachId);
    var fachCol = fach ? Lesify.getFachColor(fach.farbe) : null;
    LesifyUI.setPageWatermark(Lesify.getFachIcon(k.fachId) || '', fachCol ? fachCol.base : null);
    document.title = 'Lernplan – ' + k.titel + ' · Lesify';
  }
  document.getElementById('back-link').href = k ? ('klausur.html?id=' + k.id) : 'klausuren.html';
  document.getElementById('back-label').textContent = k ? 'Zurück zur Klausur' : 'Zu den Klausuren';

  function draw() {
    var body = document.getElementById('lp-body');
    body.innerHTML = R.lernplanSeite(lernplanId);
    R.wireLernplan(body, lernplanId, draw);
  }
  draw();
});
</script>
</body>
</html>
