<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abo &amp; Sitze · Eltern-Bereich · Lesify</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>(function(){try{if(localStorage.getItem("lesify:darkmode")==="1")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
</head>
<body data-page="eltern-abo">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="main-inner" id="eltern-main"></main>
  </div>
</div>

<script src="assets/js/api.js?v=20260923stream"></script>
<script src="assets/js/auth-gate.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var I = LesifyUI.Icons, main = document.getElementById('eltern-main');

  function modal(title, sub, bodyHtml, onConfirm, confirmLabel, danger) {
    var scrim = document.createElement('div');
    scrim.className = 'modal-scrim';
    scrim.innerHTML =
      '<div class="modal" style="max-width:420px">' +
        '<div class="modal-head"><div>' +
          '<h3 class="modal-title">' + title + '</h3>' +
          (sub ? '<p class="modal-sub">' + sub + '</p>' : '') +
        '</div><button class="modal-close" type="button" aria-label="Schließen">' + I.x + '</button></div>' +
        '<div class="modal-body">' + bodyHtml + '</div>' +
        '<div class="modal-foot">' +
          '<button class="btn btn-ghost" type="button" data-x>Abbrechen</button>' +
          '<button class="btn btn-primary" type="button" data-ok' + (danger ? ' style="background:var(--rot);border-color:var(--rot)"' : '') + '>' + (confirmLabel || 'Speichern') + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(scrim);
    requestAnimationFrame(function () { scrim.classList.add('is-open'); });
    function close() { scrim.classList.remove('is-open'); setTimeout(function () { scrim.remove(); }, 200); }
    scrim.addEventListener('click', function (e) { if (e.target === scrim) close(); });
    scrim.querySelector('.modal-close').addEventListener('click', close);
    scrim.querySelector('[data-x]').addEventListener('click', close);
    scrim.querySelector('[data-ok]').addEventListener('click', function () {
      var ergebnis = onConfirm(scrim);
      if (ergebnis && typeof ergebnis.then === 'function') ergebnis.then(function (r) { if (r !== false) close(); });
      else if (ergebnis !== false) close();
    });
    return scrim;
  }

  async function render() {
    var abo = await Lesify.getAbo();
    var belegt = (await Lesify.kinder()).length;
    // Vollständige Werte aus `AboStatus` (Prisma) — der Prototyp kannte nur
    // aktiv/gekuendigt/pausiert, das echte Abo kann zusätzlich `test`
    // (Trial) und `zahlung_offen` sein (Entscheidung 2026-09-13: hier
    // nachgezogen, sonst widersprechen sich Status-Chip und Aktions-Buttons).
    var statusMap = {
      test: ['gruen', 'Testphase'],
      aktiv: ['gruen', 'Aktiv'],
      gekuendigt: ['rot', 'Gekündigt — läuft zum Periodenende aus'],
      pausiert: ['gelb', 'Sommerpause'],
      zahlung_offen: ['rot', 'Zahlung ausstehend'],
    };
    var abgelaufen = abo.status === 'gekuendigt' && new Date(abo.aktuellerZeitraumEnde) <= new Date();
    if (abgelaufen) statusMap.gekuendigt = ['rot', 'Beendet — Kinder haben keinen Zugriff mehr'];
    var st = statusMap[abo.status] || statusMap.aktiv;
    var laeuft = abo.status === 'aktiv' || abo.status === 'test' || abo.status === 'zahlung_offen';
    var datum = function (iso) { return LesifyUI.Render.formatDatum(String(iso).slice(0, 10)); };

    // Hinweis je Zustand (2026-09-23, Zugriffsregeln in api/src/lib/aboZugriff.ts)
    var hinweis = '';
    if (abo.status === 'zahlung_offen') {
      hinweis = '<div class="abo-hinweis" role="status"><div><b>Die letzte Zahlung ist fehlgeschlagen</b>' +
        'Deine Kinder können ihre Inhalte weiter ansehen, aber nichts Neues anlegen.' +
        (abo.loeschungAm ? ' Geht die Zahlung bis zum <b style="display:inline">' + datum(abo.loeschungAm) + '</b> nicht ein, werden die Kind-Profile samt Inhalten gelöscht und das Abo beendet.' : '') +
        '<div style="margin-top:10px"><button class="btn btn-sm btn-primary" type="button" data-portal>Zahlungsmethode aktualisieren</button></div></div></div>';
    } else if (abo.status === 'pausiert') {
      hinweis = '<div class="abo-hinweis abo-hinweis--gelb" role="status"><div><b>Sommerpause aktiv</b>' +
        'Es wird nichts abgebucht. Deine Kinder können sich während der Pause nicht in die App einloggen — alle Inhalte bleiben erhalten.</div></div>';
    } else if (abgelaufen) {
      hinweis = '<div class="abo-hinweis" role="status"><div><b>Dein Abo ist beendet</b>' +
        'Deine Kinder haben keinen Zugriff mehr. Ihre Inhalte bleiben noch gespeichert. <a href="/preise/">Neu abschließen</a></div></div>';
    }

    main.innerHTML =
      '<div class="page-head"><div>' +
        '<div class="page-eyebrow">Eltern-Bereich</div>' +
        '<h1 class="page-title">Abo &amp; Sitze</h1>' +
        '<p class="page-sub">Tarif, Abrechnung und Familien-Plätze.</p>' +
      '</div></div>' + hinweis +
      '<div class="card eltern-card">' +
        '<h3>Aktueller Tarif</h3>' +
        '<p class="eltern-sub">Ein zusätzlicher Platz greift sofort; ein Platz weniger wird zum Ende des Abrechnungszeitraums wirksam.</p>' +
        '<div class="abo-row"><span class="lbl">Tarif</span><span class="val">' + abo.planName + '</span></div>' +
        '<div class="abo-row"><span class="lbl">Abrechnung</span><span class="val">' + (abo.intervall === 'jaehrlich' ? 'Jährlich' : 'Monatlich') + '</span></div>' +
        '<div class="abo-row"><span class="lbl">Plätze</span><span class="val">' +
          '<span class="seat-step">' +
            '<button type="button" id="seat-minus"' + (abo.sitze <= Math.max(2, belegt) ? ' disabled' : '') + '>−</button>' +
            '<span id="seat-count">' + abo.sitze + '</span>' +
            '<button type="button" id="seat-plus"' + (abo.sitze >= 4 ? ' disabled' : '') + '>+</button>' +
          '</span>' +
          '<span class="text-xs text-muted">' + belegt + ' belegt</span>' +
        '</span></div>' +
        (abo.geplanteSitze != null
          ? '<div class="abo-row"><span class="lbl"></span><span class="val text-xs text-muted">' +
              'Sinkt auf ' + abo.geplanteSitze + ' Plätze ab ' + LesifyUI.Render.formatDatum(abo.aktuellerZeitraumEnde.slice(0, 10)) +
              ' — dafür noch ' + Math.max(0, belegt - abo.geplanteSitze) + ' Kind-Profil(e) entfernen.' +
            '</span></div>'
          : '') +
        '<div class="abo-row"><span class="lbl">Status</span><span class="val">' +
          '<span class="ampel-chip ampel-chip-' + st[0] + '"><span class="ampel-dot ampel-' + st[0] + '"></span>' + st[1] + '</span>' +
        '</span></div>' +
        '<div class="kc-actions" style="margin-top:18px">' +
          (laeuft
            ? '<button class="btn btn-sm btn-ghost" data-abo="pausieren">Sommerpause</button>' +
              '<button class="btn btn-sm btn-ghost" data-abo="kuendigen" style="color:var(--rot)">Kündigen</button>'
            : abgelaufen
              ? '<a class="btn btn-sm btn-primary" href="/preise/">Neu abschließen</a>'
              : '<button class="btn btn-sm btn-primary" data-abo="reaktivieren">Abo reaktivieren</button>') +
          (abgelaufen ? '' : '<button class="btn btn-sm btn-ghost" type="button" data-portal>Zahlungsmethode &amp; Rechnungen</button>') +
        '</div>' +
      '</div>';
    abo.belegt = belegt;
    wire(abo);
  }

  /* Sitzänderung mit Kostenvorschau (Entscheidung 2026-09-23): erst
     GET /abo/vorschau, dann Bestätigung mit Beträgen, erst danach PATCH /abo.
     Erhöhung → Button „Zahlungspflichtig hinzufügen" (Button-Lösung, § 312j BGB). */
  function euro(cent) {
    return (cent / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  }
  function proIntervall(iv) { return iv === 'jaehrlich' ? ' / Jahr' : ' / Monat'; }
  async function sitzAendern(abo, ziel) {
    var v;
    try { v = await Lesify.aboVorschau({ sitze: ziel }); }
    catch (err) { LesifyUI.toast(Lesify.fehlerText(err)); return; }
    var mehr = ziel > abo.sitze;
    var d = function (iso) { return LesifyUI.Render.formatDatum(String(iso).slice(0, 10)); };
    var zeile = function (l, w, stark) {
      return '<div class="abo-row"><span class="lbl">' + l + '</span><span class="val"' + (stark ? ' style="font-weight:700"' : '') + '>' + w + '</span></div>';
    };
    var body =
      zeile('Plätze', v.sitze.vorher + ' → ' + v.sitze.nachher) +
      zeile('Bisher', euro(v.aktuell.betragCent) + proIntervall(v.aktuell.intervall)) +
      zeile(mehr ? 'Neu, ab sofort' : 'Neu, ab ' + d(v.wirksamAm), euro(v.neu.betragCent) + proIntervall(v.neu.intervall), true);
    var text;
    if (!mehr) {
      text = 'Der Platz bleibt bis zum ' + d(v.wirksamAm) + ' nutzbar. Danach wird der neue Betrag abgebucht' +
        (v.sitze.nachher < (abo.belegt || 0) ? ' — vorher musst du noch ein Kind-Profil entfernen.' : '.');
    } else if (v.imTest) {
      text = 'Du bist noch in der kostenlosen Testphase — jetzt wird nichts abgebucht. Am ' + d(v.naechsteAbbuchung.am) +
        ' wird erstmals ' + euro(v.naechsteAbbuchung.betragCent) + ' abgebucht.';
    } else {
      body += zeile('Anteilig bis ' + d(v.naechsteAbbuchung.am), euro(v.anteiligCent));
      text = 'Für die restliche Zeit des laufenden Zeitraums wird der anteilige Betrag berechnet. Er wird mit der nächsten Abbuchung am ' +
        d(v.naechsteAbbuchung.am) + ' fällig — insgesamt dann ' + euro(v.naechsteAbbuchung.betragCent) + '.';
    }
    body += '<p class="text-sm" style="margin:14px 0 0;color:var(--ink-700);line-height:1.6">' + text + '</p>' +
      '<p class="text-xs text-muted" style="margin:8px 0 0">Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</p>';
    modal(mehr ? 'Platz hinzufügen' : 'Platz entfernen', null, body, async function () {
      try {
        var neu = await Lesify.aendernAbo({ sitze: ziel });
        LesifyUI.toast(mehr ? 'Ein Platz ergänzt.' : neu.geplanteSitze != null ? 'Platz wird zum Periodenende entfernt.' : 'Platz entfernt.');
        render();
      } catch (err) { LesifyUI.toast(Lesify.fehlerText(err)); return false; }
    }, mehr ? 'Zahlungspflichtig hinzufügen' : 'Platz entfernen');
  }

  function wire(abo) {
    var seatMinus = document.getElementById('seat-minus'), seatPlus = document.getElementById('seat-plus');
    if (seatPlus) seatPlus.addEventListener('click', function () { sitzAendern(abo, abo.sitze + 1); });
    if (seatMinus) seatMinus.addEventListener('click', function () { sitzAendern(abo, abo.sitze - 1); });
    LesifyUI.qsa('[data-portal]').forEach(function (b) {
      b.addEventListener('click', async function () {
        b.disabled = true;
        try { var r = await Lesify.zahlungsportal(); location.href = r.url; }
        catch (err) { b.disabled = false; LesifyUI.toast(Lesify.fehlerText(err)); }
      });
    });
    LesifyUI.qsa('[data-abo]').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.getAttribute('data-abo');
        if (a === 'kuendigen') {
          modal('Abo kündigen?', 'Das Abo läuft bis zum Ende des bezahlten Zeitraums weiter — bis dahin bleibt alles nutzbar.',
            '<p class="text-sm" style="margin:0;color:var(--ink-700)">Wird das Konto beendet, werden die Inhalte gelöscht.</p>',
            async function () {
              try { await Lesify.kuendigenAbo(); LesifyUI.toast('Abo gekündigt.'); render(); }
              catch (err) { LesifyUI.toast(Lesify.fehlerText(err)); return false; }
            }, 'Kündigen', true);
        } else if (a === 'pausieren') {
          modal('Sommerpause starten?', 'Während der Pause wird nichts abgebucht.',
            '<p class="text-sm" style="margin:0;color:var(--ink-700);line-height:1.6">Deine Kinder können sich in dieser Zeit nicht in die App einloggen. Alle Inhalte bleiben erhalten, und du kannst die Pause jederzeit hier beenden.</p>',
            async function () {
              try { await Lesify.pausierenAbo(); LesifyUI.toast('Sommerpause aktiviert — Inhalte bleiben erhalten.'); render(); }
              catch (err) { LesifyUI.toast(Lesify.fehlerText(err)); return false; }
            }, 'Pause starten');
        } else if (a === 'reaktivieren') {
          Lesify.reaktivierenAbo().then(function () {
            LesifyUI.toast('Abo wieder aktiv.'); render();
          }).catch(function (err) { LesifyUI.toast(Lesify.fehlerText(err)); });
        }
      });
    });
  }

  await render();
});
</script>
</body>
</html>
