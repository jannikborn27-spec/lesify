<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Mail bestätigen — Lesify</title>
<meta name="robots" content="noindex,follow">
<meta name="description" content="E-Mail-Adresse für das Lesify-Konto bestätigen.">
<link rel="icon" href="/assets/img/logo.png">
<link rel="stylesheet" href="/assets/css/marketing.css">
</head>
<body data-page="email-bestaetigen" data-nav="none">

<div class="auth">
  <aside class="auth__aside">
    <a class="brand" href="/" aria-label="Lesify — Startseite">
      <span class="brand__mark"><img src="/assets/img/logo-mark.svg" alt="Lesify" width="18" height="18"></span>
      <span class="brand__word">Lesify</span>
    </a>
    <div class="auth__aside-body">
      <h2>Fast geschafft.</h2>
      <p>Ein letzter Klick, dann ist die E-Mail-Adresse bestätigt.</p>
    </div>
  </aside>

  <div class="auth__main">
    <div class="auth-card">
      <h1>E-Mail bestätigen</h1>
      <p class="co-message is-visible" data-rolle="status" role="status">Wird geprüft …</p>
      <p class="auth-alt"><a href="/login/">Zur Anmeldung</a></p>
    </div>
  </div>
</div>

<script src="/assets/js/marketing.js"></script>
<script src="/assets/js/auth-forms.js"></script>

</html>
