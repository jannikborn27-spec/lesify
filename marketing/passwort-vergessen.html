<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passwort zurücksetzen — Lesify</title>
<meta name="description" content="Passwort für das Lesify-Konto zurücksetzen.">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/marketing.css">
</head>
<body data-page="passwort-vergessen" data-nav="none">

<div class="auth">
  <aside class="auth__aside">
    <a class="brand" href="index.html" aria-label="Lesify — Startseite">
      <span class="brand__mark"><img src="assets/img/logo-mark.svg" alt="Lesify" width="18" height="18"></span>
      <span class="brand__word">Lesify</span>
    </a>
    <div class="auth__aside-body">
      <h2>Kein Problem, das ist schnell erledigt.</h2>
      <p>Sie bekommen einen Link per E-Mail und vergeben ein neues Passwort. Alle Inhalte bleiben unverändert.</p>
    </div>
  </aside>

  <div class="auth__main">
    <div class="auth-card">
      <a class="auth-card__back" href="login.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Zurück zur Anmeldung</a>
      <h1>Passwort zurücksetzen</h1>
      <p class="auth-card__sub">Geben Sie die E-Mail-Adresse Ihres Kontos ein.</p>

      <form data-demo="Prototyp ohne Backend — es wird keine echte E-Mail verschickt." style="margin-top:2rem" novalidate>
        <div class="field">
          <label for="email">E-Mail</label>
          <input class="input" type="email" id="email" name="email" placeholder="name@beispiel.de" autocomplete="email" required>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Link zum Zurücksetzen senden</button>
      </form>

      <p class="auth-alt">Doch wieder eingefallen? <a href="login.html">Zur Anmeldung</a></p>
    </div>
  </div>
</div>

<script src="assets/js/marketing.js"></script>
</body>
</html>
