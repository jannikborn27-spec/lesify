<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suchen · Lesify</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>(function(){try{if(localStorage.getItem("lesify:darkmode")==="1")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
</head>
<body data-page="suchen">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="main-inner">

      <div class="page-head">
        <div>
          <div class="page-eyebrow">Suchen</div>
          <h1 class="page-title">Alles an einem Ort finden</h1>
          <p class="page-sub">Fächer, Themen, Chats, Lernzettel, Dateien, Klausuren und Testklausuren durchsuchen.</p>
        </div>
      </div>

      <div class="search-input-wrap" style="max-width:560px;margin-bottom:var(--sp-10)">
        <span id="search-icon" class="search-field-ico"></span>
        <input type="text" class="search-input" id="search-input" placeholder="z. B. Bruchrechnung, Gedichtanalyse, Essay…" aria-label="Suche" autofocus>
      </div>

      <div id="search-results"></div>

    </main>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth-gate.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var I = LesifyUI.Icons;
  document.getElementById('search-icon').innerHTML = I.search;

  var params = new URLSearchParams(window.location.search);
  var input = document.getElementById('search-input');
  input.value = params.get('q') || '';

  // Fach-Cache vorladen, sonst bleiben die Ergebnis-Zeilen grau statt
  // fach-eingefärbt: `Lesify.getFach()` (genutzt für --fach-color in den
  // Suchzeilen) ist ein reiner Cache-Lookup, kein eigener Server-Call — der
  // Cache wird nur gefüllt, wenn irgendwo vorher `Lesify.faecher()` gelaufen
  // ist. Auf dashboard.html passiert das nebenbei über das Fächer-Widget,
  // suche.html hat kein äquivalentes Widget.
  var faecherReady = Lesify.faecher().catch(function () {});

  // api.js hat keinen sync client-seitigen Suchindex (anders als data.js) —
  // GET /suche übernimmt das serverseitig, gleiche Gruppen-Form wie zuvor
  // LesifyUI.search() ({type,label,icon,items}) — Rendering unverändert.
  // `anfrageN` verwirft veraltete Antworten bei schnellem Tippen.
  var anfrageN = 0;
  function render() {
    var q = input.value.trim();
    var results = document.getElementById('search-results');
    if (!q) {
      results.innerHTML = '<div class="empty-state"><div class="es-icon">' + I.search + '</div><h4>Was suchst du?</h4><p>Tipp einfach los — die Ergebnisse erscheinen live.</p></div>';
      return;
    }
    var anfrage = ++anfrageN;
    Lesify.suche(q).then(function (groups) {
      if (anfrage !== anfrageN) return;
      if (!groups.length) {
        results.innerHTML = '<div class="empty-state"><div class="es-icon">' + I.search + '</div><h4>Keine Ergebnisse für „' + q + '"</h4><p>Versuch einen anderen Begriff oder prüfe die Schreibweise.</p></div>';
        return;
      }
      results.innerHTML = LesifyUI.searchResultsHtml(groups);
    }).catch(function (err) {
      if (anfrage !== anfrageN) return;
      LesifyUI.toast(Lesify.fehlerText(err));
    });
  }

  input.addEventListener('input', render);
  faecherReady.then(render);
});
</script>
</body>
</html>
