<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neues Passwort — Lesify</title>
<meta name="description" content="Neues Passwort für das Lesify-Konto vergeben.">
<link rel="icon" href="/assets/img/logo.png">
<link rel="stylesheet" href="/assets/css/marketing.css">
</head>
<body data-page="passwort-zuruecksetzen" data-nav="none">

<div class="auth">
  <aside class="auth__aside">
    <a class="brand" href="/" aria-label="Lesify — Startseite">
      <span class="brand__mark"><img src="/assets/img/logo-mark.svg" alt="Lesify" width="18" height="18"></span>
      <span class="brand__word">Lesify</span>
    </a>
    <div class="auth__aside-body">
      <h2>Fast geschafft.</h2>
      <p>Neues Passwort vergeben — danach kannst du dich sofort damit anmelden.</p>
    </div>
  </aside>

  <div class="auth__main">
    <div class="auth-card">
      <a class="auth-card__back" href="/login/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Zurück zur Anmeldung</a>
      <h1>Neues Passwort vergeben</h1>
      <p class="auth-card__sub">Bitte ein neues Passwort mit mindestens 8 Zeichen wählen.</p>

      <form style="margin-top:2rem" novalidate>
        <div class="field">
          <label for="pw">Neues Passwort</label>
          <input class="input" type="password" id="pw" name="pw" placeholder="mindestens 8 Zeichen" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="pw2">Passwort wiederholen</label>
          <input class="input" type="password" id="pw2" name="pw2" placeholder="nochmal eingeben" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Passwort speichern</button>
      </form>
    </div>
  </div>
</div>

<script src="/assets/js/marketing.js"></script>
<script src="/assets/js/auth-forms.js"></script>
</body>
</html>
