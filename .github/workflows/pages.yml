name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - 'app/**'
      - '.github/workflows/pages.yml'
      - 'scripts/build-site.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Site zusammenstellen
        run: |
          bash scripts/build-site.sh
          echo "www.lesify.de" > _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
