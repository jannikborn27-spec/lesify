<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernzettel · Lesify</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css?v=20260930b">
<script>(function(){try{if(localStorage.getItem("lesify:darkmode")==="1")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
</head>
<body data-page="klausuren">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="main-inner" style="padding-bottom:60px">

      <div id="sp-crumb" class="page-eyebrow" style="margin-bottom:16px"></div>
      <div class="page-head" id="sp-head" data-skeleton="kopf" style="margin-bottom:var(--sp-6)"></div>

      <div class="split-doc" id="sp-doc" data-skeleton="block" style="max-width:760px"></div>

    </main>
  </div>
</div>

<script src="assets/js/api.js?v=20260930b"></script>
<script src="assets/js/auth-gate.js"></script>
<script src="assets/js/app.js?v=20260930b"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var I = LesifyUI.Icons, R = LesifyUI.Render;
  var params = new URLSearchParams(window.location.search);
  var lernplanId = params.get('lernplan') || params.get('id');
  // Lernplan und Fächer-Cache gleichzeitig laden.
  var lpP = lernplanId
    ? Lesify.getLernplan(lernplanId)
    : params.get('klausur') ? Lesify.getLernplanFuerKlausur(params.get('klausur')) : Promise.resolve(null);
  var lp = (await Promise.all([lpP.catch(function () { return null; }), Lesify.faecher()]))[0];

  if (!lp) {
    document.getElementById('sp-head').innerHTML =
      '<div><h1 class="page-title">Lernzettel nicht gefunden</h1>' +
      '<p class="page-sub">Zu diesem Lernplan gibt es keinen Lernzettel.</p></div>';
    return;
  }
  lernplanId = lp.id;

  // lp.klausur kommt bereits eingebettet (GET /lernplaene/:id) — kein
  // eigener Lesify.getKlausur()-Aufruf nötig. Fächer-Cache ist oben geladen.
  var k = lp.klausur;
  var fach = k ? Lesify.getFach(k.fachId) : null;
  if (k) {
    var fachCol = fach ? Lesify.getFachColor(fach.farbe) : null;
    LesifyUI.setPageWatermark(Lesify.getFachIcon(k.fachId) || '', fachCol ? fachCol.base : null);
    document.title = 'Lernzettel – ' + k.titel + ' · Lesify';
  }

  document.getElementById('sp-crumb').innerHTML =
    '<a href="lernplan.html?id=' + lernplanId + '" style="color:var(--ink-500)">Lernplan</a>' +
    '<span style="color:var(--ink-400);margin:0 6px">/</span><span>Lernzettel</span>';

  var updatedLine = lp.lernzettel ? ('Aktualisiert: ' + lp.lernzettel.aktualisiertAm) : 'Noch nicht gestartet';
  var actions = lp.lernzettel
    ? '<div class="page-actions"><button class="btn btn-secondary btn-sm" id="sp-download">' + I.download + ' Herunterladen</button>' +
      '<a href="lernplan.html?id=' + lernplanId + '" class="btn btn-ghost btn-sm">Zurück zum Lernplan</a></div>'
    : '<div class="page-actions"><a href="lernplan.html?id=' + lernplanId + '" class="btn btn-ghost btn-sm">Zurück zum Lernplan</a></div>';

  document.getElementById('sp-head').innerHTML =
    '<div>' + (k ? R.fachBadge(k.fachId) : '') +
      '<h1 class="page-title" style="margin-top:14px;font-size:1.6rem">Lernzettel' + (k ? ' — ' + k.titel : '') + '</h1>' +
      '<p class="page-sub">' + updatedLine + '</p>' +
    '</div>' + actions;

  document.getElementById('sp-doc').innerHTML = R.lernzettelSeite(lernplanId);
  var slot = document.querySelector('#sp-doc .pdf-slot');
  if (slot) {
    document.getElementById('sp-doc').classList.add('is-pdf');
    LesifyUI.pdfVorschau(slot, slot.getAttribute('data-pdf-path')).catch(function () {});
  }

  var dl = document.getElementById('sp-download');
  if (dl) dl.addEventListener('click', function () {
    LesifyUI.pdfDownload('/lernplaene/' + lernplanId + '/lernzettel/dokument', 'lernzettel-' + Lesify.slugify(k ? k.titel : 'lernplan'))
      .catch(function (err) { LesifyUI.toast(Lesify.fehlerText(err)); });
  });
});
</script>
</body>
</html>
