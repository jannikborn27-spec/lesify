<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinder &amp; Zugänge · Eltern-Bereich · Lesify</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css?v=20260930e">
<script>(function(){try{if(localStorage.getItem("lesify:darkmode")==="1")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
</head>
<body data-page="eltern-kinder">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="main-inner" id="eltern-main" data-skeleton="seite"></main>
  </div>
</div>

<script src="assets/js/api.js?v=20260930e"></script>
<script src="assets/js/auth-gate.js"></script>
<script src="assets/js/app.js?v=20260930e"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var R = LesifyUI.Render, I = LesifyUI.Icons, main = document.getElementById('eltern-main');

  var kinder = []; // lokaler Sync-Cache, siehe loadKinder()
  var plaetze = []; // Nutzung je Platz (GET /abo/sitze) — hängt am Platz, nicht am Kind
  async function loadKinder() {
    var r = await Promise.all([
      Lesify.kinder(),
      Lesify.sitze ? Lesify.sitze().catch(function () { return null; }) : null
    ]);
    kinder = r[0];
    plaetze = (r[1] && r[1].sitze) || [];
  }
  function sitzVon(kindId) {
    for (var i = 0; i < plaetze.length; i++) if (plaetze[i].kind && plaetze[i].kind.id === kindId) return plaetze[i];
    return null;
  }
  function usageZeile(u) {
    if (!u) return '';
    function q(label, x) { return label + ' ' + x.used + (x.limit == null ? '' : '/' + x.limit); }
    return '<div class="kc-usage">' +
      '<span class="kc-usage-cap">Diesen Monat</span>' +
      [q('Nachrichten', u.nachrichten), q('Content-Aufnahmen', u.dateien), q('Lernzettel', u.lernzettel), q('Klausurvorbereitungen', u.testklausuren)]
        .map(function (t) { return '<span>' + t + '</span>'; }).join('') +
    '</div>';
  }
  function freierPlatzCard(sitz) {
    var u = sitz.usage;
    var benutzt = u && (u.nachrichten.used + u.dateien.used + u.lernzettel.used + u.testklausuren.used) > 0;
    return '<div class="card kind-card kind-card--frei" style="padding:16px 20px">' +
      '<span class="kc-meta"><span class="kc-name">Platz ' + sitz.sitzNr + ' · frei</span>' +
      '<span class="kc-sub">' + (benutzt
        ? 'Der Verbrauch dieses Monats bleibt am Platz und gilt für das nächste Kind weiter.'
        : 'Noch nichts verbraucht.') + '</span></span>' +
      (benutzt ? usageZeile(u) : '') +
    '</div>';
  }
  function findKind(id) {
    for (var i = 0; i < kinder.length; i++) if (kinder[i].id === id) return kinder[i];
    return null;
  }

  /* ---- kleiner, wiederverwendbarer Modal-Helfer ---- */
  function modal(title, sub, bodyHtml, onConfirm, confirmLabel, danger) {
    var scrim = document.createElement('div');
    scrim.className = 'modal-scrim';
    scrim.innerHTML =
      '<div class="modal" style="max-width:420px">' +
        '<div class="modal-head"><div>' +
          '<h3 class="modal-title">' + title + '</h3>' +
          (sub ? '<p class="modal-sub">' + sub + '</p>' : '') +
        '</div><button class="modal-close" type="button" aria-label="Schließen">' + I.x + '</button></div>' +
        '<div class="modal-body">' + bodyHtml + '</div>' +
        '<div class="modal-foot">' +
          '<button class="btn btn-ghost" type="button" data-x>Abbrechen</button>' +
          '<button class="btn btn-primary" type="button" data-ok' + (danger ? ' style="background:var(--rot);border-color:var(--rot)"' : '') + '>' + (confirmLabel || 'Speichern') + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(scrim);
    requestAnimationFrame(function () { scrim.classList.add('is-open'); });
    function close() { scrim.classList.remove('is-open'); setTimeout(function () { scrim.remove(); }, 200); }
    scrim.addEventListener('click', function (e) { if (e.target === scrim) close(); });
    scrim.querySelector('.modal-close').addEventListener('click', close);
    scrim.querySelector('[data-x]').addEventListener('click', close);
    scrim.querySelector('[data-ok]').addEventListener('click', function () {
      var ergebnis = onConfirm(scrim);
      if (ergebnis && typeof ergebnis.then === 'function') ergebnis.then(function (r) { if (r !== false) close(); });
      else if (ergebnis !== false) close();
    });
    return scrim;
  }

  function kindCard(kind) {
    var col = Lesify.getKindColor(kind.id);
    var pending = !kind.eingeladen;
    var sub = kind.klassenstufe + ' · ' + LesifyUI.kindZugangAnmeldung(kind);

    return '<div class="card kind-card is-open' + (pending ? ' is-pending' : '') + '" data-kind="' + kind.id + '" style="padding:0">' +
      '<div style="display:flex;align-items:center;gap:14px;padding:16px 20px">' +
        '<span class="fach-avatar" style="width:38px;height:38px;background:' + col.base + '"><span>' +
          kind.name.charAt(0).toUpperCase() + '</span></span>' +
        '<span class="kc-meta"><span class="kc-name">' + kind.name + '</span><span class="kc-sub">' + sub + '</span></span>' +
        '<a class="btn btn-sm btn-ghost" href="eltern-kind.html?id=' + kind.id + '">Details' + I.arrowRight + '</a>' +
      '</div>' +
      (sitzVon(kind.id) ? '<div style="padding:0 20px 14px">' + usageZeile(sitzVon(kind.id).usage) + '</div>' : '') +
      '<div class="kc-body" style="border-top:1px solid var(--line)">' +
        '<div class="kc-actions" style="margin-top:0">' +
          (kind.eingeladen
            ? '<button class="btn btn-sm btn-ghost" data-act="einladen">Zugang ändern</button>'
            : '<button class="btn btn-sm btn-primary" data-act="einladen">Zugang einrichten</button>') +
          (kind.eingeladen ? '<button class="btn btn-sm btn-ghost" data-act="ansehen">Als ' + kind.name.split(' ')[0] + ' ansehen</button>' : '') +
          '<button class="btn btn-sm btn-ghost" data-act="entfernen" style="color:var(--rot)">Entfernen</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  async function render() {
    await loadKinder();
    var abo = await Lesify.getAbo().catch(function () { return null; });
    var sitze = abo ? abo.sitze : kinder.length;
    var voll = kinder.length >= sitze;
    // Konto ohne Abo (Kasse abgebrochen, Testdurchgang 2026-09-29): statt
    // „0 von 0 Plätzen belegt — alle Plätze belegt" zum Abschluss führen.
    var keinAbo = !abo && !kinder.length;
    main.innerHTML =
      '<div class="page-head"><div>' +
        '<div class="page-eyebrow">Eltern-Bereich</div>' +
        '<h1 class="page-title">Kinder &amp; Zugänge</h1>' +
        '<p class="page-sub">' + (keinAbo
          ? 'Kinder kannst du hinzufügen, sobald du einen Tarif gewählt hast.'
          : kinder.length + ' von ' + sitze + ' Plätzen belegt. Jedes Kind hat ein eigenes, unabhängiges Profil.') + '</p>' +
      '</div></div>' +
      (keinAbo
        ? '<div class="abo-hinweis abo-hinweis--gelb" role="status"><div><b>Noch kein Tarif gewählt</b>' +
          'Wähle einen Tarif und starte die 14 Tage kostenlose Testphase. Danach legst du hier die Profile deiner Kinder an.' +
          '<div style="margin-top:10px"><a class="btn btn-sm btn-primary" href="/preise/">Tarif wählen</a></div></div></div>'
        : '<div id="kinder-liste">' + kinder.map(kindCard).join('') +
            plaetze.filter(function (s) { return !s.kind; }).map(freierPlatzCard).join('') + '</div>' +
          '<button class="btn btn-primary" id="kind-add"' + (voll ? ' disabled' : '') + '>' + I.plus + ' Kind hinzufügen</button>' +
          (voll ? '<p class="kc-hint">Alle Plätze belegt — auf <a href="eltern-abo.html">Abo &amp; Sitze</a> kannst du einen Platz ergänzen.</p>' : ''));
    if (keinAbo) return;
    wire();
  }

  function wire() {
    document.getElementById('kinder-liste').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      e.preventDefault();
      var card = btn.closest('[data-kind]');
      var id = card.getAttribute('data-kind');
      var kind = findKind(id);
      var act = btn.getAttribute('data-act');

      if (act === 'einladen') {
        LesifyUI.kindZugangModal(kind, render);
      } else if (act === 'ansehen') {
        Lesify.kinderSitzung(id).then(function (r) {
          Lesify.startElternModus(r.token);
          window.location.href = 'dashboard.html';
        }).catch(function (err) { LesifyUI.toast(Lesify.fehlerText(err)); });
      } else if (act === 'entfernen') {
        modal('„' + kind.name + '" entfernen?', 'Alle Fächer, Chats, Lernzettel, Dateien und Klausuren dieses Kindes werden unwiderruflich gelöscht. Der Platz wird wieder frei — der Verbrauch dieses Monats bleibt aber am Platz und gilt für ein neues Kind weiter.',
          '<p class="text-sm" id="m-confirm-hint" style="margin:0;color:var(--ink-700)">Zum Bestätigen bitte den Vornamen <strong>' + kind.name.split(' ')[0] + '</strong> eingeben.</p>' +
          '<div class="field mt-0" style="margin-top:10px"><input class="input" id="m-confirm" type="text" autocomplete="off" aria-labelledby="m-confirm-hint"></div>',
          async function (scrim) {
            if (scrim.querySelector('#m-confirm').value.trim() !== kind.name.split(' ')[0]) { scrim.querySelector('#m-confirm').focus(); return false; }
            try {
              await Lesify.removeKind(id);
              LesifyUI.toast(kind.name + ' wurde entfernt.');
              render();
            } catch (err) {
              LesifyUI.toast(Lesify.fehlerText(err));
              return false;
            }
          }, 'Endgültig entfernen', true);
      }
    });

    var addBtn = document.getElementById('kind-add');
    if (addBtn && !addBtn.disabled) addBtn.addEventListener('click', function () {
      modal('Kind hinzufügen', 'Legt ein neues Profil an. Den Zugang (Benutzername oder E-Mail-Einladung) richtest du danach ein.',
        '<div class="field"><label for="m-name">Name</label><input class="input" id="m-name" type="text" placeholder="Vor- und Nachname"></div>' +
        '<div class="field mt-0"><label for="m-klasse">Klassenstufe</label><select class="select" id="m-klasse">' + LesifyUI.klassenOptionenHtml('', false) + '</select></div>',
        async function (scrim) {
          var name = scrim.querySelector('#m-name').value.trim();
          var klasse = scrim.querySelector('#m-klasse').value.trim();
          if (!name) { scrim.querySelector('#m-name').focus(); return false; }
          if (!klasse) { scrim.querySelector('#m-klasse').focus(); return false; }
          try {
            await Lesify.addKind({ name: name, klassenstufe: klasse });
            LesifyUI.toast(name + ' hinzugefügt.');
            render();
          } catch (err) {
            LesifyUI.toast(err.code === 'sitze_ausgeschoepft' ? 'Alle Plätze belegt.' : Lesify.fehlerText(err));
            return false;
          }
        }, 'Anlegen');
    });
  }

  render();
});
</script>
</body>
</html>
