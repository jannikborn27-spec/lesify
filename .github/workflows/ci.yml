name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version kommt aus `packageManager` im Root-package.json (doppelt → Abbruch)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # API importiert @lesify/shared aus dist/ und braucht den Prisma-Client
      - run: pnpm --filter @lesify/shared build
      - run: pnpm --filter @lesify/api db:generate

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

# Deploy-Schritt kommt in Phase 16 (UMSETZUNGSPLAN.md) dazu.
