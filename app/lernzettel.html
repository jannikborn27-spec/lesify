<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernzettel · Lesify</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css?v=20260919pdf">
<script>(function(){try{if(localStorage.getItem("lesify:darkmode")==="1")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<style>
  .lz-msg { display: flex; gap: 10px; max-width: 90%; animation: fade-up 280ms var(--ease-out); }
  .lz-msg.from-user { align-self: flex-end; flex-direction: row-reverse; }
  .lz-avatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .lz-msg.from-ai .lz-avatar { background: var(--fach-color, var(--ink-950)); color: #fff; padding: 6px; }
  .lz-msg.from-user .lz-avatar { background: var(--fach-bg, var(--ink-200)); color: var(--fach-ink, var(--ink-700)); font-size: 0.64rem; font-weight: 700; }
  /* Markdown-Inhalt (LesifyUI.mdToHtml) in KI-Blasen */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 0.7em; }
  .md h2, .md h3, .md h4 { margin: 1em 0 0.4em; line-height: 1.3; font-weight: 700; }
  .md h2 { font-size: 1.05em; }
  .md h3 { font-size: 1em; }
  .md h4 { font-size: 0.95em; }
  .md ul, .md ol { margin: 0 0 0.7em; padding-left: 1.3em; }
  .md ul { list-style: disc; }
  .md li.md-task { list-style: none; margin-left: -1.1em; }
  .md ol { list-style: decimal; }
  .md li { margin: 0.2em 0; }
  .md strong { font-weight: 700; }
  .md blockquote { margin: 0 0 0.7em; padding: 8px 12px; background: var(--bg-canvas); border-radius: 10px; color: var(--ink-700, inherit); }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.86em; background: var(--bg-canvas); padding: 1px 5px; border-radius: 5px; }
  .md pre { margin: 0 0 0.7em; padding: 10px 12px; background: var(--bg-canvas); border-radius: 10px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 0.9em 0; }
  .md-table-wrap { overflow-x: auto; margin: 0 0 0.7em; }
  .md table { border-collapse: collapse; font-size: 0.92em; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 12px; text-align: left; }
  .md th { background: var(--bg-canvas); font-weight: 600; }
  .lz-bubble { padding: 10px 13px; border-radius: 13px; font-size: 0.84rem; line-height: 1.5; }
  .lz-msg.from-ai .lz-bubble { background: var(--bg-surface); border: 1px solid color-mix(in srgb, var(--fach-color, var(--ink-400)) 24%, var(--line)); border-top-left-radius: 4px; }
  .lz-msg.from-user .lz-bubble { background: var(--fach-color, var(--ink-950)); color: #fff; border-top-right-radius: 4px; }
  .lz-composer { display: flex; gap: 8px; align-items: flex-end; }
  .lz-composer textarea { flex: 1; border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: 10px 12px; font-family: inherit; font-size: 0.85rem; resize: none; max-height: 100px; }
  .lz-composer textarea:focus { outline: none; border-color: var(--fach-color, var(--ink-900)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fach-color, var(--ink-900)) 16%, transparent); }
  .lz-hint { font-size: 0.72rem; color: var(--fach-ink, var(--ink-500)); }
  /* Fachfarbe auf der ganzen Seite */
  .lz-page .split-view { border-color: color-mix(in srgb, var(--fach-color) 30%, var(--line)); }
  .lz-page .split-doc { border-right-color: color-mix(in srgb, var(--fach-color) 24%, var(--line)); }
  .lz-page .pdf-pages { background: color-mix(in srgb, var(--fach-color) 7%, var(--ink-50)); }
  .lz-page .split-chat { background: color-mix(in srgb, var(--fach-color) 4%, var(--ink-50)); }
  .lz-page .split-chat-head { background: var(--fach-bg); border-bottom-color: color-mix(in srgb, var(--fach-color) 24%, var(--line)); }
  .lz-page .split-chat-head .fw-600 { color: var(--fach-ink); }
  .lz-page .split-chat-composer { border-top-color: color-mix(in srgb, var(--fach-color) 24%, var(--line)); }
  .lz-page #lz-send { background: var(--fach-color); border-color: var(--fach-color); color: #fff; }
  .lz-page #lz-send:hover:not(:disabled) { filter: brightness(1.08); }
  .lz-page #lz-download { border-color: color-mix(in srgb, var(--fach-color) 45%, var(--line-strong)); color: var(--fach-ink); }
  .lz-page .page-title { color: var(--fach-ink, var(--ink-950)); }
  .lz-page .empty-state { color: var(--fach-ink, inherit); }
  .lz-page .empty-state p { color: var(--ink-600); }
  .lz-crumb-fach { color: var(--fach-ink); font-weight: 600; }
</style>
</head>
<body data-page="themen">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="topbar-root"></div>
    <main class="main-inner lz-page" id="lz-main" style="padding-bottom:60px">

      <div id="lz-crumb" class="page-eyebrow" style="margin-bottom:16px"></div>
      <div class="page-head" id="lz-head" style="margin-bottom:var(--sp-6)"></div>

      <div class="split-view">
        <div class="split-doc is-pdf" id="lz-doc"></div>
        <div class="split-chat">
          <div class="split-chat-head">
            <div class="flex justify-between items-center">
              <span class="text-sm fw-600">Gemeinsam überarbeiten</span>
              <span class="lz-hint">Zählt wie eine Chat-Nachricht</span>
            </div>
          </div>
          <div class="split-chat-thread" id="lz-thread"></div>
          <div class="split-chat-composer">
            <div class="lz-composer">
              <textarea id="lz-input" rows="1" placeholder="Was soll angepasst werden?"></textarea>
              <button class="btn btn-primary btn-sm" id="lz-send" style="width:38px;height:38px;padding:0;border-radius:10px" aria-label="Senden"></button>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth-gate.js"></script>
<script src="assets/js/app.js?v=20260919pdf"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var I = LesifyUI.Icons, R = LesifyUI.Render;
  var params = new URLSearchParams(window.location.search);
  await Lesify.themen(); // Cache für R.badge()/Lesify.label() unten

  // Kein `?id=` (Prototyp-Komfort): jüngsten Lernzettel des Users nehmen
  // (GET /lernzettel ist bereits nach aktualisiertAm desc sortiert).
  var lzId = params.get('id');
  var lz;
  try {
    if (!lzId) {
      var alle = await Lesify.lernzettel();
      if (!alle.length) throw new Error('keine Lernzettel');
      lzId = alle[0].id;
    }
    lz = await Lesify.getLernzettel(lzId);
  } catch (err) {
    window.location.href = 'dashboard.html';
    return;
  }
  lzId = lz.id;
  var themaLabel = Lesify.label(lz.themaId);

  document.title = lz.titel + ' · Lesify';
  // Fachfarbe (--fach-color/-ink/-bg) auf die ganze Seite legen.
  document.getElementById('lz-main').setAttribute('style', 'padding-bottom:60px;' + LesifyUI.fachColorVars(lz.fachId));
  document.getElementById('lz-crumb').innerHTML =
    '<a href="thema.html?id=' + lz.themaId + '&tab=lernzettel" style="color:var(--fach-ink,var(--ink-500))">' + themaLabel.thema + '</a>' +
    '<span style="color:var(--ink-400);margin:0 6px">/</span><span class="lz-crumb-fach">Lernzettel</span>';

  document.getElementById('lz-head').innerHTML =
    '<div>' + R.badge(lz.themaId) +
      '<h1 class="page-title" style="margin-top:14px;font-size:1.6rem">' + lz.titel + '</h1>' +
      '<p class="page-sub">Zuletzt bearbeitet ' + lz.updated + '</p>' +
    '</div>' +
    '<div class="page-actions"><button class="btn btn-secondary btn-sm" id="lz-download">' + I.download + ' Als PDF herunterladen</button>' +
      '<a href="thema.html?id=' + lz.themaId + '&tab=lernzettel" class="btn btn-ghost btn-sm">Zurück zum Thema</a></div>';
  document.getElementById('lz-download').addEventListener('click', function () {
    LesifyUI.pdfDownload('/lernzettel/' + lzId + '/pdf', Lesify.slugify(lz.titel))
      .catch(function (err) { LesifyUI.toast(Lesify.fehlerText(err)); });
  });

  function renderDoc() {
    // Der Lernzettel ist ein PDF (Basisvorlage + Inhalt); hier die Live-Vorschau davon.
    LesifyUI.pdfVorschau(document.getElementById('lz-doc'), '/lernzettel/' + lzId + '/pdf').catch(function () {});
  }

  // Markdown-Helfer mit Fallback: falls ein gecachtes, älteres app.js noch kein
  // LesifyUI.mdToHtml kennt, bleibt der Verlauf lesbar statt leer zu rendern.
  function escSafe(t) { return (window.LesifyUI && LesifyUI.mdEscape) ? LesifyUI.mdEscape(t) : String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function mdSafe(t, o) { return (window.LesifyUI && LesifyUI.mdToHtml) ? LesifyUI.mdToHtml(t, o) : escSafe(t).replace(/\n/g, '<br>'); }

  // Initialen der angemeldeten Person für den Nutzer-Avatar (statt fest „JB").
  var userInitials = '';
  try { Lesify.getUser().then(function (u) { userInitials = (u && u.initials) || ''; renderThread(); }, function () {}); } catch (e) {}

  function renderThread() {
    var thread = document.getElementById('lz-thread');
    if (!lz.revisionen.length) {
      thread.innerHTML = '<div class="empty-state"><p>Sag mir, was am Lernzettel angepasst werden soll — z. B. „füg ein Beispiel zu X hinzu" oder „kürze Abschnitt Y".</p></div>';
      return;
    }
    thread.innerHTML = lz.revisionen.map(function (m) {
      if (m.rolle === 'ai') return '<div class="lz-msg from-ai"><span class="lz-avatar">' + I.spark + '</span><span class="lz-bubble md">' + mdSafe(m.text) + '</span></div>';
      return '<div class="lz-msg from-user"><span class="lz-avatar">' + userInitials + '</span><span class="lz-bubble">' + escSafe(m.text).replace(/\n/g, '<br>') + '</span></div>';
    }).join('');
    thread.scrollTop = thread.scrollHeight;
  }

  renderDoc(); renderThread();

  var input = document.getElementById('lz-input');
  input.addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(100, this.scrollHeight) + 'px'; });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  document.getElementById('lz-send').innerHTML = I.send;
  document.getElementById('lz-send').addEventListener('click', send);

  var sending = false;
  async function send() {
    if (sending) return;
    var text = input.value.trim();
    if (!text) return;
    sending = true;
    var sendBtn = document.getElementById('lz-send');
    input.disabled = true; sendBtn.disabled = true;
    input.value = ''; input.style.height = 'auto';
    try {
      lz = await Lesify.addLernzettelRevision(lzId, text);
      renderDoc(); renderThread();
    } catch (err) {
      LesifyUI.toast(Lesify.fehlerText(err));
    } finally {
      sending = false;
      input.disabled = false; sendBtn.disabled = false;
      input.focus();
    }
  }
});
</script>
</body>
</html>
